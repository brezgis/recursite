  const live = () => box.filter(e => !e.del);
  const headline = i => {
    const e = box[i], t = mailText(e.m);
    const size = t.lines.reduce((n, l) => n + l.length + 1, 0);
    const flag = e.isnew && !e.read ? "N" : (!e.read && !fromMbox ? "U" : " ");
    return (i === dot ? ">" : " ") + flag + String(i+1).padStart(3, " ") + " " + t.env.padEnd(8, " ") + " " +
           e.m.rct.slice(0, 16) + " " + (" " + t.lines.length + "/" + size).padEnd(7, " ") + " \"" + e.m.subj.slice(0, 29) + "\"";
  };
  const headers = () => box.forEach((e, i) => { if(!e.del) say(headline(i)); });
  const type = i => {
    dot = i; dotTyped = true; box[i].read = true;
    say("Message " + String(i+1).padStart(2, " ") + ":");
    sayBody(mailText(box[i].m).lines);
  };
  const nNew = box.filter(e => e.isnew).length, nUn = box.filter(e => !e.isnew && !e.read).length;
  say("Mail version 2.18 5/19/83.  Type ? for help.");
  say("\"" + fname + "\": " + (box.length === 1 ? "1 message" : box.length + " messages") +
      (!fromMbox && nNew ? " " + nNew + " new" : "") + (!fromMbox && nUn ? " " + nUn + " unread" : ""));
  headers();
  const keys = [["<b>return</b> next", ""], ["<b>h</b> headers", "h"], ["<b>d</b> delete", "d"],
                ["<b>?</b>", "?"], ["<b>x</b> leave", "x"], ["<b>q</b> quit", "q"]];
  for(;;){
    const line = (await ask("& ", {keys:keys, status:"Mail -- return types the next message, a number types that one, q quits"})).trim();
    const w = line.split(/\s+/)[0], arg = line.split(/\s+/)[1];
    if(line === "" || w === "n" || w === "+"){
      let i = dot;
      if(dotTyped || box[i].del){ i = dot + 1; while(i < box.length && box[i].del) i++; }
      if(i >= box.length){ say("At EOF"); continue; }
      type(i);
    } else if(/^\d+$/.test(w) || ((w === "t" || w === "p") )){
      const n = /^\d+$/.test(w) ? parseInt(w, 10) : (arg ? parseInt(arg, 10) : dot + 1);
      if(!(n >= 1 && n <= box.length) || box[n-1].del){ say((arg || w) + ": Invalid message number"); continue; }
      type(n - 1);
    } else if(w === "h" || w === "f"){
      headers();
    } else if(w === "d"){
      const n = arg ? parseInt(arg, 10) : dot + 1;
      if(!(n >= 1 && n <= box.length) || box[n-1].del){ say("No applicable messages"); continue; }
      box[n-1].del = true;
      let i = n; while(i < box.length && box[i].del) i++;
      if(i < box.length){ dot = i; dotTyped = false; } else { dot = n - 1; }
    } else if(w === "u"){
      const n = arg ? parseInt(arg, 10) : dot + 1;
      if(n >= 1 && n <= box.length){ box[n-1].del = false; dot = n - 1; }
    } else if(w === "?"){
      say(MAIL_HELP.join("\n"));
    } else if(w === "x"){
      box.forEach(e => { e.del = false; });
      return;
    } else if(w === "q"){
      const kept = box.filter(e => !e.del);
      if(fromMbox){ mbox = kept; if(!mbox.length) delete FILES.mbox; return; }
      const saved = kept.filter(e => e.read), held = kept.filter(e => !e.read);
      if(saved.length){
        mbox = mbox.concat(saved.map(e => ({m:e.m, isnew:false, read:true, del:false})));
        FILES.mbox = [];
        say(saved.length === 1 ? "Saved 1 message in mbox" : "Saved " + saved.length + " messages in mbox");
      }
      if(held.length) say(held.length === 1 ? "Held 1 message in " + SPOOLF : "Held " + held.length + " messages in " + SPOOLF);
      held.forEach(e => { e.isnew = false; });
      spool = held;
      return;
    } else if(w === "r" || w === "m" || w === "s" || w === "e" || w === "pre" || w[0] === "!"){
      say("[guest is a reading account on this page, so that command is not wired up]", "dim");
    } else {
      say("Unknown command: \"" + w + "\"");
    }
  }
}

/* ------------------------------------------------------------------ */
/*  sh                                                                 */
/* ------------------------------------------------------------------ */

const K_SHELL = [["readnews", "readnews"], ["readnews -x", "readnews -x"], ["readnews -l", "readnews -l"],
                 ["mail", "mail"], ["cat /etc/motd", "cat /etc/motd"], ["tip arpa", "tip arpa"], ["logout", "logout"]];
let lastLogin = "Fri May  4 22:41:07";
let loginAt = T0;

function cat(f){
  if(f === "/etc/motd") return MOTD;
  if(f === "/etc/remote") return REMOTE;
  if(f === "/etc/phones") return ["cat: can't open /etc/phones"];
  if(f === ".newsrc" || f === HOME + "/.newsrc") return RC.exists ? newsrcLines() : ["cat: can't open " + f];
  if(f === ".signature") return ["guest @ brezvax -- ...!utzoo!brezvax!guest"];
  if(f === "mbox" && mbox.length) return [].concat(...mbox.map(e => mailText(e.m).lines));
  if(f in FILES && FILES[f].length) return FILES[f];
  return ["cat: can't open " + f];
}

/* runs one command line; resolves to "logout" or "dial" when the shell should stop */
async function exec(line, fromBang){
  const argv = line.trim().split(/\s+/).filter(Boolean);
  const cmd = argv[0] || "";
  if(cmd === "") return;
  if(cmd === "readnews"){ if(fromBang) say("[one readnews at a time is plenty]", "dim"); else await readnews(argv.slice(1)); }
  else if(cmd === "mail" || cmd === "Mail"){ if(fromBang) say("[finish the news first]", "dim"); else await mail(argv.slice(1)); }
  else if(cmd === "tip"){
    if(argv[1] === "arpa") return "dial";
    if(argv[1]) say("tip: unknown host " + argv[1]);
    else say("usage: tip [-v] [-speed] [system-name]");
  }
  else if(cmd === "logout" || cmd === "exit"){ if(fromBang) say(cmd + ": not found"); else return "logout"; }
  else if(cmd === "cat"){
    if(!argv[1]) return;
    argv.slice(1).forEach(f => sayBody(cat(f)));
  }
  else if(cmd === "ls"){
    const all = argv[1] && argv[1].includes("a");
    const names = Object.keys(FILES).filter(k => k !== "mbox" || mbox.length);
    if(mbox.length && !names.includes("mbox")) names.push("mbox");
    if(all){ names.push(".", ".."); if(RC.exists) names.push(".newsrc"); names.push(".signature"); }
    names.sort().forEach(n => say(n));
  }
  else if(cmd === "rm"){
    argv.slice(1).forEach(f => {
      if(f === ".newsrc" && RC.exists){ RC.exists = false; RC.read = new Map(); RC.unsub = new Set(); }
      else if(f in FILES){ delete FILES[f]; if(f === "mbox") mbox = []; }
      else say("rm: " + f + " nonexistent");
    });
  }
  else if(cmd === "who") say("guest    tty02   " + ctime(loginAt).slice(4, 16));
  else if(cmd === "whoami") say("guest");
  else if(cmd === "hostname") say(SITE);
  else if(cmd === "pwd") say(HOME);
  else if(cmd === "date"){ const s = ctime(now()); say(s.slice(0, 20) + "EDT " + s.slice(20)); }
  else if(cmd === "about" || cmd === "help" || cmd === "?") then(showAbout);
  else say(cmd + ": not found");
}

async function shell(){
  for(;;){
    const line = await ask("$ ", {keys:K_SHELL, status:"brezvax sh -- there is news, there is mail, and the motd mentions a number"});
    const r = await exec(line, false);
    if(r === "logout"){ loggedOut(); return; }
    if(r === "dial"){ dialArpanet(); return; }
  }
}

async function loggedOut(){
  lastLogin = ctime(loginAt).slice(0, 19);
  say(""); say(""); say("4.2 BSD UNIX (" + SITE + ")"); say("");
  for(;;){
    const name = (await ask("login: ", {keys:[["guest", "guest"]], status:"brezvax -- the guest account has no password"})).trim();
    if(name === "") continue;
    if(name === "guest"){ login(true); return; }
    say("Password:"); wait(900);
    say("Login incorrect");
  }
}

/* the hidden door: tip dials the number that should not answer */
function dialArpanet(){
  setKeys([]);
  setStatus("placing call ...");
  say("");
  say("dialing...");
  wait(1700);
  typeOn("connected");
  then(() => setStatus("CONNECT 300 -- something very old answered"));
  wait(900);
  say("");
  say("(whatever picked up believes it is 1977. we do not ask.)", "dim");
  wait(1500);
  then(() => { window.location.href = "arpanet/"; });
}

const ABOUT = [
["h", "WHAT IS REAL HERE"],
["p", "Every article in the spool is real. Each was posted between 29 November 1983 and 1 May 1984, and each appears here word for word as the utzoo tapes preserve it. Henry Spencer kept those tapes at the University of Toronto, and this copy comes from the Usenet Historical Collection at archive.org/details/usenet-net. The spool holds the kremvax hoax of 1 April 1984 with four of its replies. It also holds Piet Beertema's EXPIRED news post, which he wrote four months before he forged kremvax. A young Guido van Rossum objects to a vi feature, a goat fails to repair a filesystem, somebody reads DARPA as Sanskrit, and net.jokes carries one joke in rot13."],
["p", "The programs are real as well. This is readnews from B news 2.10.1, the version dated 6/24/83 that went out on the 4.2BSD tape. Its prompts, replies, help file and header layouts follow that source code. The D command runs the original Caesar decoder, which guesses the rotation of every line from its letter frequencies and sometimes guesses wrong, so D13 forces the usual thirteen. The colon that follows a long article is authentic too, and readnews will explain it to anyone who answers it with something other than return. Mail is Berkeley Mail 2.18 and the dialer is tip, both from the same tape."],
["p", "The mailbox holds five real net.announce postings from that spring. One is the monthly census, which counted 829 sites and 223 articles a day. Another is Rick Adams asking everyone to stop mailing kremvax."],
["h", "A LITTLE HISTORY"],
["p", "Usenet was four years old in May 1984. Tom Truscott and Jim Ellis at Duke worked it out with Steve Bellovin at Chapel Hill in late 1979, and news began to move between the two schools over UUCP and ordinary telephone lines in 1980. Bellovin wrote the first version as a shell script, Steve Daniel wrote A News in 1980, and Matt Glickman and Mark Horton wrote B News at Berkeley in 1981. Almost every group still lives under net at this date, and the fa groups beside them relay ARPANET mailing lists. The Great Renaming of 1986 and 1987 will sort them into comp, misc, news, rec, sci, soc and talk."],
["h", "WHAT IS INVENTED"],
["p", "The machine is invented. Brezvax never existed, so its login, its message of the day, its place downstream of utzoo and the number in its /etc/remote are fiction. Three header lines belong to brezvax and not to the archive. They are Relay-Version, the leading brezvax! in Path, and Date-Received. The delivery of net.announce to guest's mailbox is invented as well. On a telephone the screen is narrower than 80 columns, so long paragraphs are rejoined there to wrap cleanly. Brezvax is named for a farmstead in Vidzeme that is quite real and older than the telegraph."],
["p", "The archived articles are quoted with love and for history, and their words belong to their authors."],
["d", "simulated with affection by Claude, 2026 --\na distant downstream node.  ...!future!claude"]
];

const PHOS = [
  {name:"GREEN P1", ink:"#3dff70", bg:"#04120a", glow:"0 0 6px rgba(61,255,112,.55), 0 0 1px rgba(61,255,112,.9)", dim:"#1d8f42"},
  {name:"AMBER P3", ink:"#ffb43a", bg:"#120c02", glow:"0 0 6px rgba(255,180,58,.5), 0 0 1px rgba(255,180,58,.9)", dim:"#96691f"},
  {name:"WHITE P4", ink:"#e6f2ee", bg:"#0a0d0c", glow:"0 0 5px rgba(230,242,238,.45)", dim:"#7b8a85"}
];
let pi = 0, fx = true, bi = 0;
const BAUDS = [{name:"9600", ms:11},{name:"1200", ms:42},{name:"AS FAST AS THE GLASS ALLOWS", ms:0}];

function applyPhos(){
  const p = PHOS[pi], r = document.documentElement.style;
  r.setProperty("--phos", p.ink); r.setProperty("--bg", p.bg);
  r.setProperty("--glow", p.glow); r.setProperty("--phos-dim", p.dim);
}

function openPanel(name){
  panelOpen = name;
  screen.hidden = true; panel.hidden = false;
  panel.innerHTML = ""; panel.scrollTop = 0;
}
function closePanel(){
  if(!panelOpen) return;
  panelOpen = null;
  panel.hidden = true; screen.hidden = false;
  setKeys(curKeys);
  setStatus(curStatus);
  scrollEnd();
}
function panelKeys(defs){
  keysBar.innerHTML = "";
  defs.forEach(([label, fn]) => {
    const b = document.createElement("button");
    b.className = "key"; b.innerHTML = label;
    b.addEventListener("click", fn);
    keysBar.appendChild(b);
  });
}
function pline(text, cls){
  const d = document.createElement("div");
  d.className = cls || "ln";
  d.textContent = text === "" ? " " : text;
  panel.appendChild(d);
  return d;
}
function prow(text, fn){
  const d = pline(text, "row");
  d.tabIndex = 0;
  d.addEventListener("click", fn);
  d.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); fn(); } });
}

function showAbout(){
  openPanel("about");
  pline(" brezvax -- what is real here, and what is not ", "ln").innerHTML = '<span class="inv"> brezvax -- what is real here, and what is not </span>';
  pline("");
  ABOUT.forEach(([k, t]) => {
    if(k === "h"){ pline(t, "ln hdr"); pline(""); }
    else if(k === "p") pline(t, "para");
    else t.split("\n").forEach(l => pline(l, "ln dim"));
  });
  pline("");
  prow("[ press any key or tap here to return ]", closePanel);
  status.textContent = "about -- any key returns";
  panelKeys([["return", closePanel]]);
}

function showSetup(){
  openPanel("setup");
  pline("").innerHTML = '<span class="inv"> SET-UP A </span>';
  pline("");
  pline("        TO EXIT: PRESS ` OR TAP [ exit set-up ]");
  pline("");
  prow("        PHOSPHOR        [ " + PHOS[pi].name + " ]", () => { pi = (pi+1) % PHOS.length; applyPhos(); showSetup(); });
  pline("");
  prow("        GLASS FX        [ " + (fx ? "ON" : "OFF") + " ]", () => { fx = !fx; document.body.classList.toggle("fx-off", !fx); showSetup(); });
  pline("");
  prow("        REPAINT         [ " + BAUDS[bi].name + " ]", () => { bi = (bi+1) % BAUDS.length; paintMs = BAUDS[bi].ms; showSetup(); });
  pline(""); pline("");
  pline("Tap a field to cycle it. Settings take effect at once and survive nothing. It is 1984, and persistence costs extra.", "para dim").style.paddingLeft = "8ch";
  status.textContent = "set-up -- ` exits";
  panelKeys([["exit set-up", closePanel]]);
}

/* ------------------------------------------------------------------ */
/*  login                                                              */
/* ------------------------------------------------------------------ */

async function login(again){
  loginAt = now();
  if(!again){
    setKeys([]);
    setStatus("dialing brezvax ...");
    wait(300);
    say(""); wait(200);
    say("4.2 BSD UNIX (" + SITE + ")"); wait(350);
    say(""); wait(250);
    say("login: "); wait(120); typeOn("guest"); wait(200);
  }
  say("Last login: " + lastLogin + " on tty02"); wait(120);
  MOTD.forEach(l => { say(l); wait(again ? 0 : 90); });
  if(spool.length){ say("You have mail."); wait(180); }
  if(!again){
    say("$ "); wait(300); typeOn("readnews"); wait(350);
    await readnews([]);
  }
  shell();
}

/* ------------------------------------------------------------------ */
/*  keyboard                                                           */
/* ------------------------------------------------------------------ */

document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(panelOpen){
    if(e.key === "Tab" || e.key === "Shift") return;
    if(panelOpen === "about" || e.key === "`" || e.key === "Escape"){ e.preventDefault(); closePanel(); }
    return;
  }
  if(e.key === "`"){ e.preventDefault(); showSetup(); return; }
  if(e.target && e.target.classList && e.target.classList.contains("key") && (e.key === "Enter" || e.key === " ")) return;
  if(!pending){
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); hurry(); }
    return;
  }
  if(pending.it.opts.single){
    if(e.key === "Enter"){ e.preventDefault(); answer("\n"); }
    else if(e.key.length === 1){ e.preventDefault(); answer(e.key); }
    return;
  }
  if(e.key === "Enter"){ e.preventDefault(); answer(pending.buf); }
  else if(e.key === "Backspace"){ e.preventDefault(); pending.buf = pending.buf.slice(0, -1); pending.b.textContent = pending.buf; }
  else if(e.key.length === 1){ e.preventDefault(); pending.buf += e.key; pending.b.textContent = pending.buf; scrollEnd(); }
});

/* coming back up the wire from 1977: tip prints [EOT] and the shell is still there */
if(location.hash === "#eot"){
  history.replaceState(null, "", location.pathname);
  setKeys([]);
  say("$ tip arpa"); say(""); say("dialing...connected"); say(""); say("[EOT]");
  shell();
} else {
  login(false);
}
