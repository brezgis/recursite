<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#241f19}

    min-height:100%;
    background:
      radial-gradient(900px 500px at 50% -5%, #322b22 0%, #241f19 65%),

    display:flex;flex-direction:column;align-items:center;
    padding-bottom:170px;
  }
  /* --- console strip -------------------------------------------- */
  .console{
    position:sticky;top:0;z-index:20;
    width:min(720px,100%);
    background:linear-gradient(180deg,#4c4840,#37342d);

  .plate{
    font-size:10px;letter-spacing:.16em;color:#cfc8b6;

  }
  .switches{display:flex;gap:6px;flex-wrap:wrap}
  .sw{
    font:inherit;font-size:10px;letter-spacing:.12em;
    color:#e8e1cf;background:linear-gradient(180deg,#5a554a,#3b3830);
    border:1px solid #23211c;border-radius:3px;padding:6px 9px;cursor:pointer;
  }
  .sw[aria-pressed="true"]{background:linear-gradient(180deg,#7c6b3c,#5b4e2c);border-color:#191712}
  .sw:focus-visible{outline:2px solid #d8c98a;outline-offset:2px}
  /* --- quick command card --------------------------------------- */
  .card{
    width:min(680px,94%);
    margin:14px 0 4px;
    background:#f7f1de;
    color:#3a362c;
    border-radius:2px;
    box-shadow:0 3px 10px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.15);
    padding:10px 12px;
    transform:rotate(-.5deg);
    position:relative;
    font-size:11px;
  }
  .card::before{
    content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(1.5deg);
    width:74px;height:16px;background:rgba(214,200,160,.75);
    box-shadow:0 1px 2px rgba(0,0,0,.25);

  .card b{letter-spacing:.12em;font-size:10px}
  .cardnote{margin-top:5px;font-size:10.5px;letter-spacing:.04em;color:#5d5646;white-space:pre-wrap}
  /* the card's command chips ride in the keyboard bar, so thumbs can reach

  .chips{display:flex;gap:6px;overflow-x:auto;width:min(700px,100%);padding:0 0 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}

  /* --- paper ------------------------------------------------------ */
  .paperwrap{

    position:relative;

<script>
/* =====================================================================
   NCC-TIP, PORT 41, 1977.

   Sources (all public; formats below are copied from them, not guessed):
   [2183] J. Malman, "User's Guide to the Terminal IMP", BBN Report 2183,
          NIC 10916, August 1975 revision (DTIC AD-A014398; scan on
          Wikimedia Commons).  Hunt character "E", "Trying..."/"Open"/
          "Closed"/"Refused"/"Can't"/"BAD"/"Num"/"Wait", the @ command
          grammar (first letter is all that matters), @@, the net-news
          reminder, and Appendix A (the host table used below).
   [EXEC] T. Myer, J. Barnaby, W. Plummer, "TENEX Executive Manual",
          BBN, April 1973 (NIC 16874; bitsavers.org/pdf/bbn/tenex).
          LOGIN, LOGOUT, SYSTAT, WHERE and DAYTIME output formats.
   [TUG]  "TENEX User's Guide", BBN, Jan 1975 with 1977 updates
          (bitsavers.org/pdf/bbn/tenex).  HOSTAT, NETSTAT, READMAIL,
          DOCTOR; the TENEX herald pattern (PTIP section, 10-26-77).
   [DIR]  "ARPANET Directory", NIC 32992, July 1975 (Computer History
          Museum, 102805037).  NICGUEST login at OFFICE-1; people.
   [MAP]  "ARPANET Logical Map, March 1977" (Wikimedia Commons).
   [RFC]  RFC 439, 527, 606, 608, 724 (rfc-editor.org).
   ===================================================================== */
(function(){
"use strict";

/* =================================================================
   PRINTER
   ================================================================= */
const paper   = document.getElementById("paper");
const kb      = document.getElementById("kb");
const sendBtn = document.getElementById("sendBtn");

let cps = 42;                 // characters per second (BRISK)
let soundOn = false;
let audio = null;

let queue = [];               // items: {text, cls}
let printing = false;
let curLine = null;
let head = null;
let gen = 0;                  // bumps on reset, so stale timers die quietly

function ensureLine(cls){
  if(!curLine){
    curLine = document.createElement("div");
    if(cls) curLine.className = cls;
    if(head && head.parentNode === paper) paper.insertBefore(curLine, head);
    else paper.appendChild(curLine);   // head may be parked inside a line mid-print
  }
}
function makeHead(){
  head = document.createElement("span");
  head.className = "head";
  paper.appendChild(head);
}
makeHead();

function jitterSpan(c, cls){
  const s = document.createElement("span");
  s.className = cls ? "ch "+cls : "ch";
  s.textContent = c;
  const dy = (Math.random()*1.1 - 0.55).toFixed(2);
  const rot = (Math.random()*1.2 - 0.6).toFixed(2);
  const op  = (0.72 + Math.random()*0.26).toFixed(2);
  s.style.transform = "translateY("+dy+"px) rotate("+rot+"deg)";
  s.style.opacity = op;
  if(Math.random() < 0.05) s.style.textShadow = "0.4px 0 currentColor"; // heavy strike
  return s;
}

/* characters are inline-blocks (for the jitter), which the browser will
   happily break between; group each word so lines wrap at spaces */
let curWord = null;
function putChar(c, cls){
  ensureLine(cls);
  if(c === " "){ curWord = null; curLine.appendChild(jitterSpan(c, cls)); return; }
  if(!curWord || curWord.parentNode !== curLine){
    curWord = document.createElement("span");
    curWord.className = "w";
    curLine.appendChild(curWord);
  }
  curWord.appendChild(jitterSpan(c, cls));
}

function scrollDown(){
  window.scrollTo({top: document.body.scrollHeight, behavior:"auto"});
}

function stepPrint(myGen){
  if(myGen !== gen) return;
  if(queue.length === 0){ printing = false; setBusy(false); return; }
  printing = true; setBusy(true);
  const item = queue[0];
  if(item.fn){ queue.shift(); item.fn(); stepPrint(myGen); return; }
  if(item.pause){ queue.shift(); setTimeout(()=>stepPrint(myGen), item.pause * (42/cps)); return; }
  if(item.text.length === 0){ queue.shift(); stepPrint(myGen); return; }
  const c = item.text[0];
  item.text = item.text.slice(1);
  if(item.text.length === 0) queue.shift();

  if(c === "\n"){
    ensureLine(item.cls);
    if(curLine.childNodes.length === 0) curLine.innerHTML = "&nbsp;";
    curLine = null;
    clack(true);
    scrollDown();
  } else {
    putChar(c, item.cls);
    if(c !== " ") clack(false);
  }
  head.remove(); paper.appendChild(head);
  if(curLine) curLine.appendChild(head);
  setTimeout(()=>stepPrint(myGen), 1000/cps * (c==="\n" ? 3.2 : 1));
}
function kick(){ if(!printing){ printing = true; setBusy(true); stepPrint(gen); } }

/* everything goes through the ASR-33, which has no lowercase: the TIP folds
   its own mixed-case messages ("Trying...", "Open") to capitals on the way */
function print(text, cls){ queue.push({text:String(text).toUpperCase(), cls:cls||""}); kick(); }
function println(text, cls){ print((text||"")+"\n", cls); }
function pause(ms){ queue.push({pause:ms}); kick(); }
function then(fn){ queue.push({fn}); kick(); }

function flush(){
  // PAPER ADVANCE: dump the whole queue instantly (pauses collapse)
  while(queue.length){
    const item = queue.shift();
    if(item.fn){ item.fn(); continue; }
    if(item.pause) continue;
    for(const c of item.text){
      if(c === "\n"){
        ensureLine(item.cls);
        if(curLine.childNodes.length === 0) curLine.innerHTML = "&nbsp;";
        curLine = null;
      } else {
        putChar(c, item.cls);
      }
    }
  }
  head.remove();
  if(curLine) curLine.appendChild(head); else paper.appendChild(head);
  gen++; printing = false; setBusy(false);
  scrollDown();
}

function setBusy(b){ sendBtn.disabled = b; }

/* =================================================================
   SOUND — tiny synthesized teletype
   ================================================================= */
function initAudio(){
  if(audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audio = new AC();
}
function clack(isReturn){
  if(!soundOn || !audio) return;
  const t = audio.currentTime;
  const dur = isReturn ? 0.05 : 0.014;
  const buf = audio.createBuffer(1, Math.max(1, Math.floor(audio.sampleRate*dur)), audio.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const src = audio.createBufferSource(); src.buffer = buf;
  const bp = audio.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = isReturn ? 420 : 2100; bp.Q.value = 1.4;
  const g = audio.createGain(); g.gain.value = isReturn ? 0.35 : 0.16;
  src.connect(bp).connect(g).connect(audio.destination);
  src.start(t);
}
function dingBell(){
  if(!soundOn || !audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  o.type = "triangle"; o.frequency.setValueAtTime(1975, t);
  const g = audio.createGain();
  g.gain.setValueAtTime(0.32, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.6);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t+0.62);
}

/* =================================================================
   1977 CLOCK — today's calendar day and wall time, moved to 1977.
   (EST/EDT by the 1977 rules: daylight time 24 APR - 30 OCT.)
   ================================================================= */
const MON  = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONL = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const DAYL = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
function d77(offsetDays){
  const n = new Date(Date.now() - (offsetDays||0)*86400000);
  let day = n.getDate();
  if(n.getMonth() === 1 && day === 29) day = 28;      // 1977 was not a leap year
  return new Date(1977, n.getMonth(), day, n.getHours(), n.getMinutes(), n.getSeconds());
}
const pad2 = x => String(x).padStart(2,"0");
function date77(off){ const d = d77(off); return d.getDate()+"-"+MON[d.getMonth()]+"-77"; }
function hhmm(){ const d = d77(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function hhmmss(){ const d = d77(); return hhmm()+":"+pad2(d.getSeconds()); }
function zone77(){
  const d = d77();
  return (d >= new Date(1977,3,24,2) && d < new Date(1977,9,30,2)) ? "EDT" : "EST";
}
function daytime(){             // format per [EXEC] p.93: FRIDAY, APRIL 13, 1973 12:34:56-EST
  const d = d77();
  return DAYL[d.getDay()]+", "+MONL[d.getMonth()]+" "+d.getDate()+", 1977 "+hhmmss()+"-"+zone77();
}

/* =================================================================
   THE NETWORK — host table, from [2183] Appendix A (August 1975),
   the newest complete table in hand.  Decimal address = IMP + 64 x host.
   ================================================================= */
const HOSTS = [
 // dec, octal, name, computer, system, status
 [ 43,"053","OFFICE-1",   "PDP-10",      "TENEX,NLS", "SERVER"],
 [ 49,"061","BBN-TENEXB", "PDP-10",      "TENEX",     "SERVER"],
 [241,"361","BBN-TENEX",  "PDP-10",      "TENEX",     "SERVER"],
 [197,"305","BBN-TENEXA", "PDP-10",      "TENEX",     "LIMITED"],
 [114,"162","BBN-TENEXD", "PDP-10",      "TENEX",     "LIMITED"],
 [134,"206","MIT-AI",     "PDP-10",      "ITS",       "LIMITED"],
 [198,"306","MIT-ML",     "PDP-10",      "ITS",       "SERVER"],
 [ 70,"106","MIT-DMS",    "PDP-10",      "ITS",       "SERVER"],
 [ 44,"054","MIT-MULTICS","H-6180",      "MULTICS",   "SERVER"],
 [ 11,"013","SU-AI",      "PDP-10",      "DEC 10/50", "SERVER"],
 [ 56,"070","SUMEX-AIM",  "PDP-10",      "TENEX",     "SERVER"],
 [ 78,"116","CMU-10A",    "PDP-10",      "DEC 10/50", "LIMITED"],
 [ 14,"016","CMU-10B",    "PDP-10",      "DEC 10/50", "SERVER"],
 [ 86,"126","USC-ISI",    "PDP-10",      "TENEX",     "SERVER"],
 [ 65,"101","UCLA-CCN",   "IBM 360/91",  "OS-MVT",    "SERVER"],
 [  7,"007","RAND-RCC",   "IBM 370/158", "OS-MVT",    "SERVER"],
 [ 71,"107","RAND-ISD",   "PDP-11/45",   "UNIX",      "SERVER"],
 [ 16,"020","AMES-67",    "IBM 360/67",  "TSS/360",   "SERVER"],
 [  9,"011","HARV-10",    "PDP-10",      "DEC 10/50", "LIMITED"],
 [ 10,"012","LL",         "IBM 370/168", "VM-370",    "LIMITED"],
 [ 32,"040","PARC-MAXC",  "MAXC",        "TENEX",     "LIMITED"],
 [ 31,"037","CCA-TENEX",  "PDP-10",      "TENEX",     "SERVER"],
 [ 46,"056","RUTGERS-10", "PDP-10",      "TOPS-10",   "SERVER"],
 [ 42,"052","LONDON",     "IBM 360/195", "OS/MVT",    "LIMITED"],
 [168,"250","NCC-TIP",    "H-316",       "TIP",       "TIP"]
];
const HOSTBYNUM = {};
HOSTS.forEach(h=>{ HOSTBYNUM[h[0]] = h; });
/* How each host answers this teletype.  Only two are wired all the way
   through; the rest answer with the TIP's own real messages [2183 s.7]. */
const ANSWERS = {
  49:"TENEXB", 43:"OFFICE1",
  241:"Host not responding", 198:"Refused", 70:"Refused", 134:"Refused",
  44:"Refused", 11:"Refused", 56:"Refused", 86:"Refused", 65:"Refused",
  32:"Host Scheduled Down Until Sat. at 1850 GMT", 42:"Net Trouble"
};

function hostsText(){
  let s = " DEC  OCT  HOST NAME    COMPUTER     SYSTEM\n"+
          " ---  ---  ---------    --------     ------\n";
  HOSTS.forEach(h=>{
    s += String(h[0]).padStart(4)+"  "+h[1]+"  "+h[2].padEnd(12)+" "+h[3].padEnd(12)+" "+h[4]+
         (h[0]===49?"  <- HERE":h[0]===43?"  <- NIC":h[0]===168?"  <- THIS TIP":"")+"\n";
  });
  s += "\n EXCERPT, AS PRINTED IN APPENDIX A OF BBN REPORT\n"+
       " 2183 (AUGUST 1975).  THE NIC KEEPS THE LIVE COPY\n"+
       " AT OFFICE-1 (HOST 43) AS <NETINFO>HOSTS.TXT.\n"+
       " TYPE @O AND A DECIMAL NUMBER TO TRY ONE.\n";
  return s;
}

/* [MAP]: IMP names exactly as printed on the March 1977 logical map.
   The regions are ours; the map itself is a tangle of lines. */
const MAP_TEXT =
`ARPANET LOGICAL MAP, MARCH 1977 -- COPIED BY HAND
ONTO 72 COLUMNS.  NAMES ARE IMP NAMES, NOT
(NECESSARILY) HOST NAMES.   [T] = TIP

 WEST
   MOFFETT  AMES15  AMES16[T]  SRI2  SRI51  LBL
   LLL  XEROX  TYMSHARE[T]  STANFORD  SUMEX
   FNWC  SCRL  UCLA  NUC  NELC[T]  RAND[T]
   ISI22  ISI52  USC[T]  DOCB[T]  GWC[T]
 MIDDLE
   UTAH[T]  ILLINOIS  ANL  CMU  SCOTT  WPAFB[T]
   AFWL[T]  TEXAS  GUNTER  EGLIN
 EAST
   MIT6  MIT44[T]  CCA  RCC5  RCC49  RCC50
   BBN30[T]  BBN40[T] <- YOU ARE HERE
   HARVARD  LINCOLN  RADC[T]  DEC  NYU
   RUTGERS[T]  ABERDEEN  BELVOIR  DCEC[T]
   SDAC (A PLURIBUS)  MITRE[T]  ARPA[T]  NSA

 OVER THE WATER, BY SATELLITE
   HAWAII[T] ~~~~~~~~ AMES15
   SDAC ~~~~~~~~ NORSAR[T] --- LONDON[T]

 BBN-TENEXB, WHERE YOU ARE LOGGED IN, IS A
 PDP-10 ON IMP 49 ("RCC49"), ONE WIRE FROM HERE.
`;

/* =================================================================
   MAIL — MESSAGE.TXT for GUEST.  Headers in the RFC 561/724 style.
   The delivery is ours; message 1 quotes RFC 724 verbatim.
   ================================================================= */
const MAIL = [
`12-MAY-77 16:40:02-EDT,712;000000000001
DATE: 12 MAY 1977 1640-EDT
FROM: NIC AT OFFICE-1
SUBJECT: NEW RFC: 724
TO: NETWORK LIAISONS, GUEST AT BBN-TENEXB

RFC 724, NIC 37435.  "PROPOSED OFFICIAL STANDARD
FOR THE FORMAT OF ARPA NETWORK MESSAGES", BY
POGRAN (MIT-MULTICS), VITTAL (BBN-TENEXA),
CROCKER (RAND-UNIX) AND HENDERSON (BBN-TENEXD).
FROM THE PREFACE, AS WRITTEN:

     PLEASE SEND ANY  COMMENTS  AND  CRITICISMS  TO
     ANY  OF  THE AUTHORS  OF  THIS  RFC  BY  15 JUNE
     1977.  IT IS PLANNED THAT THE STANDARD WILL BE
     OFFICIALLY ADOPTED BY  1  SEPTEMBER  1977, WITH
     HOSTS EXPECTED TO ACCEPT ITS SYNTAX BY 1
     JANUARY 1978.

TYPE "RFC 724" AT THE EXEC FOR THE OPERATOR'S NOTE.
`,
`2-JUN-77 09:15:40-EDT,640;000000000001
DATE: 2 JUN 1977 0915-EDT

function tipCommand(rest){
  const words = rest.trim().toUpperCase().split(/\s+/).filter(Boolean);
  const w0 = words[0] || "";
  const arg = words[words.length-1];
  const c = w0[0] || "";
  if(c === "O" || c === "L"){                 // OPEN #, and LOGIN #, "an obsolete form of OPEN"
    if(words.length < 2 && !/\d/.test(w0)){ println("Num"); return afterTip(); }
    const n = /^\d+$/.test(arg) ? parseInt(arg,10) : (/^[OL](\d+)$/.test(w0) ? parseInt(w0.slice(1),10) : NaN);
    if(isNaN(n)){ println("Num"); return afterTip(); }
    if(conn){ println("Can't"); return afterTip(); }
    openHost(n); return;
  }
  if(c === "C"){                              // CLOSE
    if(conn){ closeConn("Closed"); return; }
    println("Closed"); return afterTip();
  }
  if(c === "N"){                              // NETWORK-VIRTUAL-TIP-EXECUTIVE
    println("Wait"); pause(1800);
    println("Host not responding");
    return afterTip();
  }
  if(c === "H"){                              // HOST #
    if(!/^\d+$/.test(arg||"")){ println("Num"); return afterTip(); }
    return afterTip();
  }
  if("EDTSIRBFPGMX".includes(c) && c){        // parameters: set quietly, as the TIP does
    return afterTip();
  }
  println("BAD");
  return afterTip();
}

function execCommand(raw){

  // things TENEX will do before LOGIN (per [EXEC] III and VIII)

      return prompt();

  switch(cmd){

    case "SYSTAT": println(systat(conn)); break;

    case "WHERE":
      if(!arg) println(" ?USER NAME REQUIRED");
      else if(user && arg === user) println(" TTY"+TTY+", JOB "+JOB+", NCC-TIP, EXEC");
      else if(arg === "OPERATOR" && conn==="TENEXB") println(" TTY12, JOB 6, EXEC");
      else println(" NOT LOGGED IN");
      break;
    case "LOGOUT": case "LOGO": case "BYE":

    case "WAKE": wake(); return;

      break;
    default:

      tenexbCommand(cmd, arg); return;
  }
  prompt();

  if(c === "IDENT" || c === "WHOIS" || c === "I") println(identLookup(words.slice(1).join(" ")));
  else if(c === "HOSTS") println(hostsTxt());
  else if(c === "NIC" || c === "HELP" || c === "?")
    println(" NETWORK MAIL: FEINLER@BBN-TENEXB\n U.S. MAIL: ARPA NETWORK INFORMATION CENTER,\n STANFORD RESEARCH INSTITUTE, MENLO PARK,\n CALIFORNIA 94025\n (AS PRINTED IN THE JULY 1975 DIRECTORY.)\n");
  else if(c === "") {}
  else if(IDENTS[c]) println(identLookup(c));
  else println(" ?  (IDENT, HOSTS, NIC, QUIT)");
  print("*");
}

/* =================================================================
   DOCTOR — a puppet.  Every canned reply below is a line the BBN TENEX
   DOCTOR actually printed in RFC 439; the echoes are the only new words.
   ================================================================= */
const DOC_GENERIC = [
  "PLEASE GO ON.",
  "WHAT DOES THAT SUGGEST TO YOU?",
  "I AM NOT SURE I UNDERSTAND YOU FULLY.",
  "WHAT ELSE WOULD YOU LIKE TO DISCUSS?",
  "WHY DO YOU SAY THAT JUST NOW?",
  "WHO ARE YOU REALLY TALKING ABOUT?",
  "DOES THAT TROUBLE YOU?",
  "IN WHAT WAY?"
];
const DOC_Q = ["WHY DO YOU ASK?","WHY DOES THAT QUESTION INTEREST YOU?","WHAT ANSWER WOULD PLEASE YOU MOST?","WHAT DO YOU THINK?","WHY ARE SUCH QUESTIONS ON YOUR MIND?"];
let docN = 0;
function startDoctor(){
  mode = "doctor"; docN = 0;
  println("");
  println("GOOD EVENING.");
  println("");
  println("TELL ME YOUR PROBLEMS.  PLEASE TERMINATE INPUT");
  println("WITH A PERIOD OR A QUESTION MARK.");
  println("");
  chipsFor();
  print("*");
}
function doctorSay(raw){
  const s = raw.trim().toUpperCase();
  const bare = s.replace(/[.?!]+$/,"");
  let r;
  if(/^(GOODBYE|BYE|QUIT)\b/.test(bare)){
    println("");
    println("IT'S BEEN MY PLEASURE, THAT'S $399.29 PLEASE.");
    println("");
    mode = "exec"; chipsFor(); prompt(); return;
  }
  const flip = t => t.replace(/\b(I|ME|MY|AM|YOU|YOUR|ARE)\b/g, w=>({I:"YOU",ME:"YOU",MY:"YOUR",AM:"ARE",YOU:"I",YOUR:"MY",ARE:"AM"}[w]));
  let m;
  if(!bare) r = "PLEASE GO ON.";
  else if((m = bare.match(/^YOU(?:'RE| ARE) (.+)/))) r = "WHAT MAKES YOU THINK I AM "+flip(m[1])+"?";
  else if((m = bare.match(/\bMY (\w+)/))) r = "YOUR "+m[1]+"?";
  else if(/\b(MAYBE|PERHAPS|PROBABLY)\b/.test(bare)) r = "YOU DON'T SEEM QUITE CERTAIN.";
  else if(/\bBECAUSE\b/.test(bare)) r = "IS THAT THE REAL REASON?";
  else if(/\b(LIKE|ALIKE|SAME|SIMILAR)\b/.test(bare)) r = "WHAT RESEMBLANCE DO YOU SEE?";
  else if(/\?$/.test(s)) r = DOC_Q[docN % DOC_Q.length];
  else r = DOC_GENERIC[docN % DOC_GENERIC.length];
  docN++;
  if(!/[.?]$/.test(s) && docN === 1) r = "PLEASE TERMINATE INPUT WITH A PERIOD OR A\nQUESTION MARK.  "+r;
  println("");
  println(r);
  println("");
  print("*");
}

   ================================================================= */
const ROOMS = {
 ROAD:{

  exits:{N:"BUILDING", IN:"BUILDING", S:"GULLY"}, dark:false },
 BUILDING:{

  exits:{S:"ROAD", OUT:"ROAD"}, dark:false },
 GULLY:{
  desc:"YOU ARE IN A ROCKY GULLY.  THE STREAMBED\nCONTINUES DOWN TO THE SOUTH.  SOMETHING GLINTS\nTHAT WAY, LOW TO THE GROUND.",
  exits:{N:"ROAD", S:"GRATE"}, dark:false },
 GRATE:{

 DEBRIS:{

  exits:{W:"ECHOES"}, dark:true },
 ECHOES:{
  desc:"A HALL OF ECHOES.  YOUR LAMPLIGHT DOES NOT FIND\nTHE CEILING.  EVERY SOUND YOU MAKE COMES BACK\nWEARING A LONGER COAT.\n\nA HOLLOW VOICE SAYS: 'RTFM.'",
  exits:{E:"DEBRIS"}, dark:true }
};

let adv = null;

function startAdvent(){
  mode = "advent";
  adv = { room:"ROAD", inv:[], lampOn:false, won:false,
          items:{ BUILDING:["LAMP"], DEBRIS:["TAPE"] } };
  chipsFor();
  println("");
  println("      C O L O S S A L   R E C O V E R Y");
  println("             O P E R A T I O N");
  println("");
  println("SOMEWHERE BELOW THESE HILLS, LAST QUARTER'S\nBACKUPS ARE MISSING.  THE AUDITORS ARRIVE MONDAY.");
  println("");
  println("(VERBS: GO N/S/E/W/IN/OUT, LOOK, TAKE, DROP,\nINVENTORY, ON, OFF, QUIT.  MAGIC IS NOT LISTED.)");
  println("");
  lookRoom(true);
  advPrompt();
}
function advPrompt(){ println(""); print("> "); }

function canSee(){
  const r = ROOMS[adv.room];
  return !r.dark || (adv.lampOn && adv.inv.includes("LAMP"));
}
function lookRoom(){
  const r = ROOMS[adv.room];
  if(!canSee()){
    println("IT IS PITCH DARK.  SOMETHING WITH TOO MANY LEGS\nIS FAINTLY AUDIBLE.  YOU'D BEST NOT WANDER.\n(THE LAMP, PERHAPS?  'ON'.)");
    return;
  }
  println(r.desc);
  const here = adv.items[adv.room] || [];
  if(here.includes("LAMP")) println("\nA SHINY BRASS LAMP SITS ON THE FLOOR.");
  if(here.includes("TAPE")) println("\nA REEL OF MAGNETIC TAPE LIES HERE, STENCILED\n'BACKUPS -- DO NOT LOSE'.");
}

function advCommand(raw){
  const line = raw.trim().toUpperCase().replace(/\b(THE|A|AN|TO)\b/g," ").replace(/\s+/g," ").trim();
  const parts = line.split(" ");
  let v = parts[0] || "", o = parts[1] || "";
  if(v === "GO"){ v = o; o = ""; }
  const DIRS = {N:"N",NORTH:"N",S:"S",SOUTH:"S",E:"E",EAST:"E",W:"W",WEST:"W",
                U:"U",UP:"U",D:"D",DOWN:"D",IN:"IN",ENTER:"IN",OUT:"OUT",EXIT:"OUT"};
  const DIRNAME = {N:"NORTH",S:"SOUTH",E:"EAST",W:"WEST",U:"UP",D:"DOWN",IN:"IN",OUT:"OUT"};
  println("");

  if(v in DIRS){
    if(!canSee() && ROOMS[adv.room].dark){
      println("BLUNDERING IN THE DARK IS HOW LEGENDS END\nBADLY.  YOU STAY PUT.");
    } else {
      const dest = ROOMS[adv.room].exits[DIRS[v]];
      if(dest){ adv.room = dest; lookRoom(); checkWin(); }
      else {
        const d = DIRS[v];
        println("THERE IS NO WAY "+(d.length===1 && d!=="U" && d!=="D" ? "TO THE "+DIRNAME[d] : DIRNAME[d])+" FROM HERE.");
      }
    }
  }
  else if(v === "LOOK" || v === "L"){ lookRoom(true); }
  else if(v === "INVENTORY" || v === "INV" || v === "I"){
    println(adv.inv.length ? "YOU ARE CARRYING:\n  "+adv.inv.join("\n  ") : "YOU ARE CARRYING NOTHING BUT RESPONSIBILITY.");
  }
  else if(v === "TAKE" || v === "GET"){
    const here = adv.items[adv.room] || [];
    if(!canSee()){ println("YOU GROPE AROUND AND FIND ONLY REGRET."); }
    else if(o && here.includes(o)){
      here.splice(here.indexOf(o),1); adv.inv.push(o);
      println(o+": TAKEN."+(o==="TAPE"?"\n\nSOMEWHERE FAR ABOVE, AN OPERATOR'S SHOULDERS\nUNTENSE, NOT KNOWING WHY.":""));
    }
    else if(!o && here.length === 1){ return advCommand("TAKE "+here[0]); }
    else println(o ? "NO "+o+" HERE." : "TAKE WHAT?");
  }
  else if(v === "DROP"){
    if(o && adv.inv.includes(o)){
      adv.inv.splice(adv.inv.indexOf(o),1);
      (adv.items[adv.room] = adv.items[adv.room] || []).push(o);
      if(o === "LAMP") adv.lampOn = false;
      println(o+": DROPPED.");
      checkWin();
    } else println(o ? "YOU HAVE NO "+o+"." : "DROP WHAT?");
  }
  else if(v === "ON" || (v==="LIGHT" && (o==="LAMP" || !o))){
    if(!adv.inv.includes("LAMP")) println("YOU HAVE NO LAMP.  THE DARK REMAINS COMMITTED.");
    else if(adv.lampOn) println("THE LAMP IS ALREADY LIT.");
    else { adv.lampOn = true; println("THE LAMP GIVES A WARM, DUTIFUL LIGHT."); println(""); lookRoom(true); }
  }
  else if(v === "OFF"){
    if(adv.lampOn){ adv.lampOn = false; println("THE LAMP GOES OUT.  BOLD."); }
    else println("THE LAMP IS ALREADY OFF.");
  }
  else if(v === "XYZZY"){
    if(adv.room === "GRATE"){
      adv.room = "DEBRIS";
      println(">> FOOMP <<\n\nTHE WORLD FOLDS ALONG A SEAM YOU NEVER NOTICED.");
      println("");
      lookRoom();
    } else if(adv.room === "DEBRIS"){
      adv.room = "GRATE";
      println(">> FOOMP <<  (THE OTHER WAY, THIS TIME.)");
      println("");
      lookRoom(true);
    } else {
      println("YOU SAY THE WORD.  NOTHING HAPPENS.  THE WORD,\nIT SEEMS, IS PARTICULAR ABOUT VENUES.");
    }
  }
  else if(v === "OPEN" && o === "GRATE"){ println("RUSTED SHUT PAST ALL ARGUMENT.  THE FRAME'S\nGRAFFITI MAY BE MORE THAN GRAFFITI."); }
  else if(v === "HELP"){ println("VERBS: GO <DIR>, LOOK, TAKE, DROP, INVENTORY,\nON, OFF, QUIT.  READ WALLS.  TRUST GRAFFITI."); }
  else if(v === "QUIT" || v === "Q"){
    println("LEAVING THE CAVE AS FOUND (MORE OR LESS).");
    endAdvent(); return;
  }
  else if(v === ""){ /* nothing */ }
  else println("I DO NOT KNOW HOW TO '"+v+"' SOMETHING.");

  advPrompt();
}

function checkWin(){
  if(adv.won) return;
  const here = adv.items[adv.room] || [];
  if(adv.room === "BUILDING" && here.includes("TAPE")){
    adv.won = true;
    println("");
    println("THE TAPE IS SAFE INDOORS.  SOMEWHERE, AN\nOPERATOR WEEPS QUIETLY WITH JOY.");
    println("");
    println("*** YOU HAVE RECOVERED THE BACKUPS ***");
    println("");
    println("SCORE: 350 OF A POSSIBLE 350.");
    println("CLASS: WORKING SYSADMIN, WHICH OUTRANKS WIZARD.");
    println("");
    println("(Q TO RETURN TO THE EXEC, OR KEEP EXPLORING.)");
  }
}

function endAdvent(){
  mode = "exec";

  println("");
  prompt();
}

/* =================================================================
   INPUT WIRING
   ================================================================= */
function dispatch(raw){
  const t = raw.trim();
  if(mode === "dead") return;
  // [2183] s.3: a command "always starts with symbol @"; "@@" sends an @
  if(t.startsWith("@") && !t.startsWith("@@")){ tipCommand(t.slice(1)); return; }
  const line = t.startsWith("@@") ? t.slice(1) : raw;
  if(!conn){
    if(line.trim()) println("(NO CONNECTION.  TIP COMMANDS START WITH @ --\n TRY @O 49, OR @O 43 FOR THE NIC.)");
    return;
  }
  if(mode === "advent") advCommand(line);
  else if(mode === "doctor") doctorSay(line);
  else if(mode === "netstat") netstatCommand(line);
  else if(mode === "nic") nicCommand(line);
  else execCommand(line);
}

function submit(){
  if(printing || mode === "dead") return;
  const raw = kb.value;
  kb.value = "";
  type(raw);
}
function type(raw){
  // print the operator's keystrokes in their own ink, then act
  queue.push({text: raw.toUpperCase() + "\n", cls:"usr"});
  then(()=>dispatch(raw));
}

sendBtn.addEventListener("click", ()=>{ submit(); kb.focus(); });
kb.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); }});

/* quick command chips */
const chipsEl = document.getElementById("chips");
const noteEl  = document.getElementById("cardnote");
function setChips(defs, note){
  chipsEl.innerHTML = "";
  defs.forEach(([label,fn])=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.addEventListener("click", fn);
    chipsEl.appendChild(b);
  });
  noteEl.textContent = note || "";
}
function cmdChip(cmd, label){
  return [label || cmd, ()=>{ if(printing || mode === "dead") return; type(cmd); }];
}
function chipsFor(){
  if(!conn){
    return setChips([cmdChip("@O 49","@O 49  BBN-TENEXB"), cmdChip("@O 43","@O 43  OFFICE-1 (NIC)"),
                     cmdChip("@O 134","@O 134  MIT-AI"),
                     ["HANG UP (BACK TO 1984)", ()=>{ window.location.href = "../"; }]],
      "THE TIP IS LISTENING.  @O <HOST NUMBER> OPENS A CONNECTION.");
  }
  if(mode === "prelogin"){
    return setChips(conn === "OFFICE1"
      ? [cmdChip("LOG NICGUEST ARPA"), cmdChip("SYSTAT"), cmdChip("@C")]
      : [cmdChip("LOGIN GUEST"), cmdChip("SYSTAT"), cmdChip("@C")],
      conn === "OFFICE1" ? "OFFICE-1: THE NIC'S PUBLIC LOGIN IS NICGUEST, PASSWORD ARPA."
                         : "BBN-TENEXB WANTS A LOGIN.  GUEST WILL DO.");
  }
  if(mode === "nic")
    return setChips([cmdChip("IDENT JAKE"), cmdChip("IDENT WRC"), cmdChip("IDENT VGC"), cmdChip("HOSTS"), cmdChip("QUIT")],
      "NIC/QUERY.  IDENT LOOKS UP PEOPLE FROM THE 1975 DIRECTORY.");
  if(mode === "doctor")
    return setChips([cmdChip("PEOPLE GET ON MY NERVES SOMETIMES."), cmdChip("ARE YOU A REAL DOCTOR?"), cmdChip("GOODBYE.")],
      "END EACH LINE WITH A PERIOD OR A QUESTION MARK.  GOODBYE. LEAVES.");
  if(mode === "netstat")
    return setChips([cmdChip("SITES"), cmdChip("SITES TIP")], "NETSTAT WANTS TO KNOW WHAT TO LIST.");
  if(mode === "advent")
    return setChips([cmdChip("LOOK"), cmdChip("N"), cmdChip("S"), cmdChip("INVENTORY"), cmdChip("QUIT")],
      "A CAVE.  MAGIC IS NOT LISTED.");
  if(conn === "OFFICE1")
    return setChips([cmdChip("NIC"), cmdChip("SYSTAT"), cmdChip("DAYTIME"), cmdChip("LOGOUT")],
      "OFFICE-1, HOST 43: THE NETWORK INFORMATION CENTER.");
  return setChips([cmdChip("HELP"), cmdChip("SYSTAT"), cmdChip("READMAIL"), cmdChip("HOSTAT"),
                   cmdChip("HOSTS"), cmdChip("MAP"), cmdChip("DOCTOR"), cmdChip("ADVENT"),
                   cmdChip("RFC"), cmdChip("LORE"), cmdChip("@C"), cmdChip("LOGOUT")],
    "BBN-TENEXB, HOST 49.  @C HANGS UP ON THIS HOST; @O 43 THEN REACHES THE NIC.");
}
