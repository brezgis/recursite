<!doctype html>
<!-- a 1977 ARPANET session, re-created: everything the terminal prints is copied
     from period documents, cited at the top of the script below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCC-TIP — 1977</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e4dcc6'/%3E%3Crect x='2' y='2' width='12' height='10' rx='2' fill='%23101210'/%3E%3Crect x='4' y='5' width='6' height='1.4' fill='%23e8f2ec'/%3E%3Crect x='4' y='8' width='4' height='1.4' fill='%23e8f2ec'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#241f19}
  html,body{height:100%}
  body{
    height:100dvh;overflow:hidden;
    background:
      radial-gradient(900px 500px at 50% -5%, #322b22 0%, #241f19 65%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 2px, transparent 2px 6px);
    font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
    display:flex;flex-direction:column;align-items:center;
  }
  /* --- the terminal: a Lear Siegler ADM-3A --------------------- */
  .term{
    flex:1 1 auto;min-height:0;
    width:min(760px,100%);
    margin:12px 0 8px;padding:16px 16px 10px;
    background:linear-gradient(180deg,#ece5d0,#d7cdb3);      /* the cream case */
    border-radius:14px 14px 8px 8px;
    box-shadow:0 12px 30px rgba(0,0,0,.6), inset 0 1px 0 #fffaf0, inset 0 -3px 0 #b9ad8f;
    display:flex;flex-direction:column;
  }
  .bezel{
    position:relative;
    flex:1 1 auto;min-height:0;
    background:#1c1b18;border-radius:10px;padding:14px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.8);
    display:flex;
    container-type:inline-size;               /* the type is sized from the glass's width */
  }
  .bezel::after{                              /* scanlines over the glass, outside its scrolling */
    content:"";position:absolute;inset:14px;border-radius:18px / 22px;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  .screen{
    position:relative;flex:1 1 auto;min-height:0;
    overflow-y:auto;scrollbar-width:none;
    background:radial-gradient(120% 120% at 50% 45%, #121614 0%, #0a0c0b 70%, #050605 100%);
    border-radius:18px / 22px;                                  /* curved glass */
    box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 8px rgba(160,200,180,.08);
    padding:18px 22px;
    color:#e6efe9;                                              /* white P4 phosphor */
    text-shadow:0 0 2px rgba(230,245,238,.55), 0 0 9px rgba(190,230,210,.22);
    /* the ADM-3A shows 80 columns: fit them where the glass is wide enough; on a phone,
       keep the type readable and let long lines wrap */
    font-size:clamp(10px, calc((100cqw - 44px) / 53.5), 15px);
    line-height:1.45;letter-spacing:.06em;
    white-space:pre-wrap;word-break:break-word;
  }
  .screen::-webkit-scrollbar{display:none}
  @media (max-width:600px){
    .term{padding:8px 8px 6px;margin:8px 0 6px;border-radius:10px 10px 6px 6px}
    .bezel{padding:7px}
    .bezel::after{inset:7px}
    .screen{padding:12px 10px;letter-spacing:.01em}
  }
  .badge{
    align-self:flex-end;margin-top:7px;
    font:bold 9px/1 Arial,Helvetica,sans-serif;letter-spacing:.18em;color:#6b6250;
  }
  .head{                                                        /* the cursor */
    display:inline-block;width:.62em;height:1.05em;vertical-align:-0.15em;
    background:#e6efe9;box-shadow:0 0 6px rgba(200,240,220,.5);
    animation:hblink 1.06s steps(1) infinite;
  }
  @keyframes hblink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .head{animation:none} }
  /* --- the deck under the terminal: commands, keyboard, switches --- */
  .deck{
    flex:0 0 auto;width:min(760px,100%);
    padding:0 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
  }
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  @media (min-width:760px){ .chips{flex-wrap:wrap;overflow-x:visible} }
  .chip{
    flex:0 0 auto;white-space:nowrap;
    font:inherit;font-size:11px;letter-spacing:.06em;
    background:#e7dfc8;border:1px solid #b7ac8e;border-bottom-width:2px;border-radius:3px;
    color:#3a362c;padding:5px 9px;cursor:pointer;
  }
  .chip:hover{background:#f1ead6}
  .chip:active{transform:translateY(1px);border-bottom-width:1px}
  .chip:focus-visible{outline:2px solid #d8c98a;outline-offset:1px}
  .hint{                                   /* the only modern words on the page: how to drive it */
    font:13px/1.4 Georgia,"Times New Roman",serif;font-style:italic;color:#a59b84;
    min-height:1.4em;
  }
  .kbinner{display:flex;gap:8px;align-items:center}
  #kb{
    flex:1;min-width:0;
    font:inherit;font-size:14px;letter-spacing:.08em;
    text-transform:uppercase;
    background:#151310;color:#e8e1cf;
    border:1px solid #57523f;border-radius:3px;
    padding:9px 10px;
  }
  #kb:focus{outline:2px solid #d8c98a;outline-offset:1px}
  #sendBtn{
    font:inherit;font-size:11px;letter-spacing:.14em;
    background:linear-gradient(180deg,#7c6b3c,#5b4e2c);
    color:#f4ecd6;border:1px solid #23211c;border-radius:3px;
    padding:9px 14px;cursor:pointer;
  }
  #sendBtn:disabled{opacity:.45;cursor:default}
  .switches{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .sw{
    font:inherit;font-size:10px;letter-spacing:.12em;
    color:#cfc8b6;background:transparent;
    border:1px solid #57523f;border-radius:3px;padding:5px 8px;cursor:pointer;
  }
  .sw[aria-pressed="true"]{color:#f4ecd6;background:#5b4e2c;border-color:#7c6b3c}
  .sw:hover{color:#f4ecd6}
  .sw:focus-visible{outline:2px solid #d8c98a;outline-offset:2px}
  .sw.hang{margin-right:auto}
</style>
</head>
<body>

<div class="term">
  <div class="bezel"><div id="screen" class="screen" aria-live="polite"></div></div>
  <div class="badge">LEAR SIEGLER &nbsp;ADM-3A</div>
</div>

<div class="deck">
  <div class="chips" id="chips" aria-label="Commands"></div>
  <p class="hint" id="hint"></p>
  <div class="kbinner">
    <input id="kb" autocomplete="off" autocapitalize="characters" spellcheck="false"
           aria-label="Keyboard" placeholder="TYPE A COMMAND, THEN RETURN">
    <button id="sendBtn">RETURN</button>
  </div>
  <div class="switches" role="toolbar" aria-label="Terminal controls">
    <button class="sw hang" id="hangBtn">HANG UP</button>
    <button class="sw" id="sndBtn" aria-pressed="false">SOUND OFF</button>
    <button class="sw" id="spdBtn" aria-pressed="false">1200 BAUD</button>
    <button class="sw" id="advBtn">SKIP AHEAD</button>
  </div>
</div>

<script>
/* =====================================================================
   NCC-TIP, 1977.  An ADM-3A on BBN's TIP opens a connection to SUMEX-AIM.

   Everything the terminal prints is copied from these (all public):
   [2183] J. Malman, "User's Guide to the Terminal IMP", BBN Report 2183,
          August 1975 revision (DTIC AD-A014398; bitsavers.org/pdf/bbn/tip).
          The hunt character E (p.4-2); "Trying..." and the replies "Open",
          "Refused", "Host not responding" (p.4-8); "Closed" (p.4-10);
          "Can't", "Num", "BAD", "Wait" (p.3-2); the @ command grammar --
          first letter of each word, @@ sends an @ (p.3-1, App. B); and the
          decimal host addresses of Appendix A.
   [EXEC] "TENEX Executive Manual", BBN, April 1973 (bitsavers.org/pdf/bbn/
          tenex).  LOGIN's reply " JOB n ON TTYn date time" (p.5), what is
          allowed before LOGIN (p.25), " ?" for an unknown command (p.19),
          WHERE and DAYTIME (p.93-94).
   [SRC]  TENEX source, github.com/PDP-10/tenex: " LOGIN PLEASE", "YOU ARE
          ALREADY LOGGED IN", and the monitor's LOGOUT lines "KILLED JOB ..."
          / "  USED ... IN ..." (the TTY number is octal).
   [SUMEX] Two recorded SUMEX-AIM sessions in the same repository:
          other/lisp/ilisp/lod.doc (19 Jan 1977: the herald " SUMEX-AIM
          Tenex 1.31.73, SUMEX-AIM Exec 1.51.41", and LOG's reply), and
   [BBD]  bbd/bbd.sample, "a recording of a sample BBD session" by Richard
          Kahler, 21 January 1977: VERSION, DAYTIME's SUMEX format, and the
          bulletin board's banner and replies, replayed word for word.
   [RFC]  RFC 439, 527, 608 and 706 (rfc-editor.org), printed whole by TYPE.

   What is not a document is only the session's own state: the time of day
   (yours, on 21 January 1977), this job's number and line, and which
   other hosts refuse.
   ===================================================================== */
(function(){
"use strict";

/* =================================================================
   PRINTER
   ================================================================= */
const screen  = document.getElementById("screen");
const kb      = document.getElementById("kb");
const sendBtn = document.getElementById("sendBtn");

let cps = 120;                // characters per second (a 1200-baud line)
let soundOn = false;
let audio = null;

let queue = [];               // items: {text, cls}
let printing = false;
let curLine = null;
let head = null;
let gen = 0;                  // bumps on reset, so stale timers die quietly

function ensureLine(cls){
  if(!curLine){
    curLine = document.createElement("div");
    if(cls) curLine.className = cls;
    screen.appendChild(curLine);
  }
}
function makeHead(){
  head = document.createElement("span");
  head.className = "head";
  screen.appendChild(head);
}
makeHead();
function parkHead(){ (curLine || screen).appendChild(head); }

/* glass, not ink: characters land as plain text, and the browser wraps
   long lines at spaces by itself */
function putChar(c, cls){
  ensureLine(cls);
  const last = curLine.lastChild;
  if(last && last.nodeType === 3) last.data += c; else curLine.appendChild(document.createTextNode(c));
}
function newline(cls){
  ensureLine(cls);
  if(curLine.childNodes.length === 0) curLine.innerHTML = "&nbsp;";
  curLine = null;
}

/* the newest line sits at the bottom of the glass and older ones roll up
   off the top -- unless the reader has scrolled back to reread */
let following = true;
screen.addEventListener("scroll", ()=>{
  following = screen.scrollHeight - screen.scrollTop - screen.clientHeight < 30;
});
function scrollDown(){ if(following) screen.scrollTop = screen.scrollHeight; }

function stepPrint(myGen){
  if(myGen !== gen) return;
  if(queue.length === 0){ printing = false; setBusy(false); return; }
  printing = true; setBusy(true);
  const item = queue[0];
  if(item.fn){ queue.shift(); item.fn(); stepPrint(myGen); return; }
  if(item.pause){ queue.shift(); setTimeout(()=>stepPrint(myGen), item.pause * (120/cps)); return; }
  if(item.text.length === 0){ queue.shift(); stepPrint(myGen); return; }
  const c = item.text[0];
  item.text = item.text.slice(1);
  if(item.text.length === 0) queue.shift();

  head.remove();
  if(c === "\n") newline(item.cls);
  else {
    putChar(c, item.cls);
    if(item.cls === "usr" && c !== " ") keyclick();   // only the operator's own keys make a sound
  }
  parkHead(); scrollDown();
  setTimeout(()=>stepPrint(myGen), 1000/cps);
}
function kick(){ if(!printing){ printing = true; setBusy(true); stepPrint(gen); } }

/* everything goes through the ADM-3A, bought without the lowercase option:
   the TIP's own mixed-case messages ("Trying...", "Open") show in capitals */
function print(text, cls){ queue.push({text:String(text).toUpperCase(), cls:cls||""}); kick(); }
function println(text, cls){ print((text||"")+"\n", cls); }
function pause(ms){ queue.push({pause:ms}); kick(); }
function then(fn){ queue.push({fn}); kick(); }

function flush(){
  // SKIP AHEAD: put the whole queue on the screen at once (pauses collapse)
  head.remove();
  while(queue.length){
    const item = queue.shift();
    if(item.fn){ item.fn(); continue; }
    if(item.pause) continue;
    for(const c of item.text){ if(c === "\n") newline(item.cls); else putChar(c, item.cls); }
  }
  parkHead();
  gen++; printing = false; setBusy(false);
  following = true; scrollDown();
}

function setBusy(b){ sendBtn.disabled = b; }

/* =================================================================
   SOUND -- the ADM-3A itself is silent; what you hear is its keyboard
   and its beeper
   ================================================================= */
function initAudio(){
  if(audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audio = new AC();
}
function keyclick(){
  if(!soundOn || !audio) return;
  const t = audio.currentTime;
  const buf = audio.createBuffer(1, Math.floor(audio.sampleRate*0.008), audio.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const src = audio.createBufferSource(); src.buffer = buf;
  const bp = audio.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3200; bp.Q.value = 2;
  const g = audio.createGain(); g.gain.value = 0.12;
  src.connect(bp).connect(g).connect(audio.destination);
  src.start(t);
}
function dingBell(){            // the ADM-3A's bell is a beeper
  if(!soundOn || !audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  o.type = "square"; o.frequency.setValueAtTime(880, t);
  const g = audio.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.09, t+0.01);
  g.gain.setValueAtTime(0.09, t+0.17);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.2);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t+0.22);
}

/* =================================================================
   1977 CLOCK — today's calendar day and wall time, moved to 1977.
   (EST/EDT by the 1977 rules: daylight time 24 APR - 30 OCT.)
   ================================================================= */
const MON  = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONL = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const DAYL = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
function d77(){
  // Friday, 21 January 1977 -- the day of the SUMEX-AIM recordings -- at your time of day
  const n = new Date();
  return new Date(1977, 0, 21, n.getHours(), n.getMinutes(), n.getSeconds());
}
const pad2 = x => String(x).padStart(2,"0");
function date77(off){ const d = d77(off); return d.getDate()+"-"+MON[d.getMonth()]+"-77"; }
function hhmm(){ const d = d77(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function hhmmss(){ const d = d77(); return hhmm()+":"+pad2(d.getSeconds()); }
function daytime(){             // as SUMEX-AIM printed it, 21 Jan 1977: FRIDAY, JANUARY 21, 1977 16:42:31
  const d = d77();
  return DAYL[d.getDay()]+", "+MONL[d.getMonth()]+" "+d.getDate()+", 1977 "+hhmmss();
}

/* =================================================================
   THE NETWORK -- decimal host addresses and names from [2183] Appendix A
   (August 1975).  One host answers this terminal: SUMEX-AIM, 56, the
   TENEX at Stanford.  Its herald is copied from a January 1977 session.
   ================================================================= */
const HOSTS = {"1":"UCLA-ATS","2":"ARC-RD","3":"UCSB-MOD75","4":"UTAH-10","6":"MIT-DEVMULTICS","7":"RAND-RCC","8":"SDC-LAB","9":"HARV-10","10":"LL","11":"SU-AI","12":"ILL-CAC","13":"GUNTER","14":"CMU-10B","15":"I4A-TENEX","16":"AMES-67","18":"RADC-MULTICS","19":"NBS-ICST","20":"ETAC","21":"LLL-RISOS","22":"ISI-SPEECH11","23":"USC-44","26":"SDAC-44","27":"BELVOIR","28":"ARPA-DMS","29":"BRL","31":"CCA-TENEX","32":"PARC-MAXC","33":"FNWC","34":"LBL","35":"UCSD-CC","36":"HAWAII-ALOHA","37":"RML-7","38":"PURDUE","39":"SDAC-CCP","40":"BBN-NCC","41":"NORSAR-40B","42":"LONDON","43":"OFFICE-1","44":"MIT-MULTICS","45":"SCI-TENEX","46":"RUTGERS-10","49":"BBN-TENEXB","50":"BBN-SPEECH-11","51":"SRI-NSC11","53":"EGLIN","54":"SCRL-ELFDEVEL","55":"ANL","56":"SUMEX-AIM","57":"NSA","65":"UCLA-CCN","66":"SRI-AI","69":"BBN-11X","70":"MIT-DMS","71":"RAND-ISD","72":"SDC-CC","73":"HARV-1","75":"SU-DSL","76":"ILL-NTS","78":"CMU-10A","79":"I4-ELF","86":"USC-ISI","95":"LL-ASG","96":"PARC-VTS","98":"UCB","103":"SDAC-DP","106":"LONDON-VDH","110":"ADR","112":"ASL","113":"BBN-SAT","114":"BBN-TENEXD","115":"SRI-IA11","118":"SCRL-ELF","129":"UCLA-CCBS","130":"SRI-ARC","131":"CHII","132":"UTAH-TIP","133":"BBN-11XB","134":"MIT-AI","138":"LL-TSP","140":"UNIVAC","142":"CMU-11","143":"I4B-TENEX","144":"AMES-TIP","145":"MITRE-TIP","146":"RADC-TIP","147":"NBS-TIP","148":"ETAC-TIP","150":"USC-ISIB","151":"USC-TIP","152":"GWC-TIP","153":"DOCB-TIP","154":"SDAC-TIP","156":"ARPA-TIP","158":"BBN-TESTIP","159":"CCA-TIP","161":"FNWC-TIP","164":"ALOHA-TIP","165":"RML-TIP","167":"SDAC-NEP","168":"NCC-TIP","169":"NORSAR-TIP","170":"LONDON-TIP","171":"TYMSHARE-TIP","174":"RUTGERS-TIP","175":"WPAFB-TIP","176":"AFWL-TIP","177":"BBN10X-TIP","179":"SRI-CBC11","180":"ISI-TIP","197":"BBN-TENEXA","198":"MIT-ML","201":"HASKINS","202":"LL-11","206":"CMU-CC","208":"AMES-11","214":"ISI-XGP11","215":"USC-ECL","218":"SDAC-CCP","223":"CCA-SIP","228":"HAWAII-500","232":"BBN-1D","233":"NORSAR-40A","241":"BBN-TENEX","243":"SRI-PKT","244":"USC-ISIC"};
const SUMEX = 56;
const HERALD = " SUMEX-AIM Tenex 1.31.73, SUMEX-AIM Exec 1.51.41";

/* what a guest can TYPE: RFCs as published (rfc-editor.org), without the
   page headers and transcriber's note of their 1999 retyping */
const FILES = {
"RFC439.TXT": "Network Working Group                                            V. Cerf\nRequest for Comments: 439                                         SU-ERL\nNIC: 13771                                               21 January 1973\n\n                      PARRY Encounters the DOCTOR\n\n   The session recorded below actually happened on 18 September 1972 and\n   is herewith reproduced for your entertainment.\n\n   Good Evening.\n\n   Tell me your problems.  Please terminate input with a period or a\n   question mark.\n\n   *People get on my nerves sometimes.\n\n   I am not sure I understand you fully.\n\n   *You should pay more attention.\n\n   Suppose you should pay more attention.\n\n   *You're entitled to your own opinion.\n\n   What makes you think I am entitled to my own opinion?\n\n   *It bothers me just to be around people in general.\n\n   Please go on.\n\n   *I went to the track at Bay Meadows a while back.\n\n   What does that suggest to you?\n\n   *I went to the races.\n\n   What else would you like to discuss?\n\n   *Horseracing interests me.\n\n   Why do you say that just now?\n\n   *There's a lot of crooked gambling going on there.\n\n   I am not sure I understand you fully,\n\n   *It's clear to me if not to you.\n\n   Do you think its likely that not to I?\n\n   *I went to the races.\n\n   Please go on.\n\n   *I gamble on horses.\n\n   What does that suggest to you?\n\n   *I went to the races.\n\n   What else would you like to discuss?\n\n   *Gambling has been nothing but trouble to me.\n\n   Why do you say that just now?\n\n   *I've had experience with crooks gambling at the track.\n\n   I am not sure I understand you fully.\n\n   *I've already told you enough about that.\n\n   Oh? I enough about that?\n\n   *I went to the races.\n\n         comment: This has to be the most persistent and patient\n         paranoid I have ever encountered.\n\n   Please go on.\n\n   *Do you know anything about bookies?\n\n   What makes you think I know anything about bookies?\n\n   *A bookie didn't pay me off once.\n\n   What does that suggest to you?\n\n   *I beat up the bookie who did not pay off, and I thought he might use\n   his friends in the underworld to get even with me.\n\n   What else would you like to discuss?\n\n   *What do you know about racketeers?\n\n   Why do you ask?\n\n   *What experience have you had gambling?\n\n   Why does that question interest you?\n\n   *I like horseraces.\n\n   What else do you like?\n\n   *I know the mob controls the big rackets.\n\n   Who are you really talking about?\n\n   *Have you ever really thought about the MAFIA?\n\n   Suppose you ever really thought about the MAFIA.\n\n   *Let's talk about something else.\n\n   I am not sure I understand you fully.\n\n   *You keep asking me the same things, why not change the topic?\n\n   In what way?\n\n   *What do you mean?\n\n   Why are such questions on your mind?\n\n   *I thought I told you, people get on my nerves.\n\n   Your nerves?\n\n   *Well, I don't know.\n\n   Don't you really know?\n\n   *I would say so.\n\n   Please go on.\n\n   *I would rather not discuss that anymore.\n\n   Would you like to discuss your nerves?\n\n   *I guess so.\n\n   What does that suggest to you?\n\n   *What are you getting at?\n\n   What answer would please you most?\n\n   *It's not a matter or like or dislike.\n\n   What else would you like to discuss?\n\n   *I am getting tired of answering the same questions over and over.\n\n   What resemblance do you see?\n\n   *Why do you need to know that?\n\n   What do you think?\n\n   *I don't understand your motives.\n\n   Why don't you understand my motives?\n\n   *Shouldn't I be?\n\n         comment: ???\n\n   Why do you say that just now?\n\n         comment: I was wondering the same thing.\n\n   *That's just the way it is.\n\n   Suppose that's just the way it were not.\n\n   *So?\n\n   I am not sure I understand you fully.\n\n   *You harp on the same questions too much.\n\n   What does that similarity suggest to you?\n\n   *I don't get you.\n\n   Do you wish that you did get I?\n\n   *It's about time you showed some interest in my feelings.\n\n   Oh? I showed some interest in your feelings?\n\n         comment: must have been an accident...\n\n   *I will help you if I trust you.\n\n   Do you wish that you trust I?\n\n   *Maybe yes, maybe no.\n\n   You don't seem quite certain.\n\n    ...Excuse me for just a minute.  Sorry to have interrupt you please\n   continue...\n\n   *Really?\n\n   Please go on.\n\n   *In my opinion you have a one-track mind.\n\n   What makes you think I have a one-track mind?\n\n         comment: you ready for this?\n\n   *I used to go to the track every week.\n\n   What does that suggest to you?\n\n   *I avoid racetracks now because the races are fixed.\n\n   Is that the real reason?\n\n   *I'd rather not discuss it.\n\n   What else would you like to discuss?\n\n   *That's something I don't want to go into.\n\n   Does that trouble you?\n\n   *I went to the races.\n\n   Why do you say that just now.\n\n   *It's none of your business.\n\n   Why are you concerned over my business?\n\n   *I don't confide in strangers.\n\n   Don't you really confide in strangers?\n\n   *Let's change the subject.\n\n   Perhaps that concerns your feelings.\n\n   *I went to the races.\n\n   I am not sure I understand you fully.\n\n   *What's wrong with you that you keep on bugging me about this?\n\n   Who are you really talking about?\n\n   *The way you repeat yourself is getting ridiculous.\n\n   Suppose you repeat myself is getting ridiculous.\n\n         comment: howzat?\n\n   *There are some tricky operators down there.\n\n   Are there really some tricky operators down there?\n\n   *The guys involved in the horseracing racket.\n\n   Please go on.\n\n   *You are a real nag.\n\n         comment: just one of the horses.\n\n   Does it please you to believe I am a real nag?\n\n   *I have had enough of this.\n\n   What does that suggest to you?\n\n   *Goodbye.\n\n   It's been my pleasure, that's $399.29 please.\n\n         comment: talk about tricky operators...\n\n   PARRY was running at SAIL and DOCTOR at BBN Tenex, both being\n   accessed from UCLA/SEX.\n",
"RFC527.TXT": "Network Working Group                                    R. Merryman  (UCSD-CC)\nRequest for Comments:  527                                              6/22/73\n\n                              ARPAWOCKY\n\n                    Twas brillig, and the Protocols\n                         Did USER-SERVER in the wabe.\n                    All mimsey was the FTP,\n                         And the RJE outgrabe,\n\n                    Beware the ARPANET, my son;\n                         The bits that byte, the heads that scratch;\n                    Beware the NCP, and shun\n                         the frumious system patch,\n\n                    He took his coding pad in hand;\n                         Long time the Echo-plex he sought.\n                    When his HOST-to-IMP began to limp\n                         he stood a while in thought,\n\n                    And while he stood, in uffish thought,\n                         The ARPANET, with IMPish bent,\n                    Sent packets through conditioned lines,\n                         And checked them as they went,\n\n                    One-two, one-two, and through and through\n                         The IMP-to-IMP went ACK and NACK,\n                    When the RFNM came, he said \"I'm game\",\n                         And sent the answer back,\n\n                    Then hast thou joined the ARPANET?\n                         Oh come to me, my bankrupt boy!\n                    Quick, call the NIC! Send RFCs!\n                         He chortled in his joy.\n\n                    Twas brillig, and the Protocols\n                         Did USER-SERVER in the wabe.\n                    All mimsey was the FTP,\n                         And the RJE outgrabe.\n\n                                                            D.L. COVILL\n                                                            May 1973\n",
"RFC608.TXT": "Network Working Group                                   M.D. Kudlick\nRFC # 608                                               SRI-ARC\nNIC # 21256                                             January 10, 1974\n\n                           HOST NAMES ON-LINE\n\nWe at the NIC agree with Peter Deutsch's suggestion (in RFC# 606 / NIC#\n21246) that the NIC maintain an online ASCII text file of Host names,\naddresses, and attributes.  That suggestion corresponds to one made by\nVint Cerf recently, and evidently receives ARPA/IPT support.\n\nJake Feinler at the NIC designed and maintains a source file, in NLS\nformat, that can be used to generate the ASCII file Peter outlined.  A\nprogram to generate an up to date version of the ASCII file needs to be\nwritten at the NIC, and run periodically (weekly, or as the situation\nwarrants).  Such a mechanism would allow us, of course, to maintain one\nsource of data and use it for this and other purposes.\n\nOur present data includes official Host name, Host address, Host status\n(user, server, TIP) and certain other information like Technical\nLiaison, Host computer, operating system, etc.\n\nProvisions exist for including attributes of the type Peter suggested\n(for example FTP byte size, TELNET duplex mode, echoing mode, and\nnicknames), but these data are currently NOT in our source file.\n\nTo get things moving, therefore, we propose to do the following things:\n\n    1)  We shall write a program to generate the ASCII file in the\n        syntax described in RFC# 606, namely:\n\n        <host-name-file> ::= <entry> / <host-name-file> <entry>\n\n        <entry> ::= <data-part> <end-of-line>\n\n            Note that this produces a blank line after the <data-part>.\n\n        <data-part> ::= <basic-part> / <data-part> <attribute-item>\n\n        <basic-part> ::= <host-name> , <host-address> <end-of-line>\n\n        <attribute-item> ::= <attribute-name> = <attribute-value> <end-\n        of-line>\n\n    2)  We shall initially include only the following items in each\n        <entry>:\n\n        a)  <basic-part>\n\n            in which <host-address> will be a decimal host address,\n            relative to the Host's own Network, and\n\n            in which <host-name> will be the official Host Name, a\n            string obtained through negotiation between the Host and the\n            NIC, governed by these constraints:\n\n                up to 48 characters drawn from the alphabet (A-Z),\n                digits (0-9), and the minus sign (-) ... specifically,\n                no blank or space characters allowed;\n\n                no distinction between upper and lower case letters;\n\n                the first character is a letter;\n\n                the last character is NOT a minus sign;\n\n                no other restrictions on content or syntax.\n\n            Note:  The Host Name may be prefixed with an Official\n            Network Name of up to 24 characters enclosed in parentheses\n            ().  The Network Name designates the Network in which the\n            Host resides.\n\n                (The characters used in the Network Name are drawn from\n                the same character set as those in the Host Name, with\n                the same constraints [except the length] as listed\n                above.)\n\n                The ASCII text file will only contain the Official\n                Network name for Hosts NOT on the ARPANET; for ARPANET\n                Hosts there will be no Network Name prefix.\n\n        b)  <attribute-item>\n\n            in which <attribute-name> initially will have the single\n            possible value STATUS, and the corresponding value of\n            <attribute-value> for STATUS will be one of these:\n\n                SERVER\n                USER\n                TIP\n                UNKNOWN\n\n        c)  <end-of-line>\n\n            this will be carriage return followed by line feed (octal\n            015  followed by  octal  12).\n\n    3)  Attributes other than those for which <attribute-name> is STATUS\n        will be added in the above format at a later date (to be\n        announced) as the data becomes available to us.\n\n        We agree with Peter that the attribute list should not be\n        construed as replacing option negotiation or any other means by\n        which one Host discovers the properties of another, but merely\n        as an alternative source of information that is simply and\n        easily accessible, in machine-readable form.\n\n        Suggestions for attributes that are worthy of inclusion in the\n        ASCII file of Hostnames are welcome.  Please send your\n        suggestions and/or data to Jake Feinler\n            FEINLER @ SRI-ARC,   or  NIC Ident  =  JAKE\n\n        For completeness, we record here the attribute suggestions given\n        in RFC# 606:\n\n            NICKNAMES -- value is a list of acceptable nicknames for the\n            host.  Any system that provides name-to-address translation\n            is encouraged (although of course not required) to accept\n            these names as alternatives to the official host name.\n\n            FTP-BYTE-SIZES -- value is a list of the byte sizes\n            supported by the FTP server.  The first byte size is the one\n            which leads to the least computational overhead (e.g. 36 for\n            PDP-10's, 32 for 360's).\n\n            ECHOING -- value is L or R depending on whether the host\n            expects the terminal to echo (Remote) or expects to do its\n            own echoing (Local).\n\nThe ASCII file generated by the NIC will reside at Host OFFICE-1 (Host\nAddress = 43 decimal), and will have the pathname\n\n    <NETINFO>HOSTS.TXT\n\nUsing this pathname with an FTP process will enable anyone, of course,\nto retrieve the file for use at any Network Host.\n\n    The login username for FTP can be GUEST,\n    password ARPA,\n    account 1.\n\nThe file will be in alphanumeric sequence by Host Name.\n\nThe date after which the file will be available at OFFICE-l will be\nannounced via RFC as soon as the file is ready.\n\nWe welcome comments on this RFC, on RFC# 606, or on any other aspect of\nthis problem.  And we wish to acknowledge the contributions of Vint\nCerf, Peter Deutsch, Jake Feinler, and Nancy Neigus in getting the\nOfficial Host Name list to happen.\n",
"RFC706.TXT": "Network Working Group                                     Jon Postel  (SRI-ARC)\nRequest for Comments: 706                                              Nov 1975\nNIC #33861\n\n                    On the Junk Mail Problem\n\nIn the ARPA Network Host/IMP interface protocol there is no\nmechanism for the Host to selectively refuse messages. This means\nthat a Host which desires to receive some particular messages must\nread all messages addressed to it. Such a Host could be sent many\nmessages by a malfunctioning Host. This would constitute a denial of\nservice to the normal users of this Host. Both the local users and\nthe network communication could suffer. The services denied are the\nprocessor time consumed in examining the undesired messages and\nrejecting them, and the loss of network thruput or increased delay\ndue to the unnecessary busyness of the network.\n\nIt would be useful for a Host to be able to decline messages from\nsources it believes are misbehaving or are simply annoying. If the\nHost/IMP interface protocol allowed the Host to say to the IMP\n\"refuse messages from Host X\", the IMPs could discard the unwanted\nmessages at their earliest opportunity returning a \"refused\" notice\nto the offending Host.\n\nHow the IMPs might do this is an open issue -- here are two\npossibilities:\n\nThe destination IMP would keep a list (per local Host) of sources\nto refuse (this has the disadvantage of keeping the network\nbusy).\n\nThe destination IMP on receiving the \"refuse messages from Host\nX\" message forwards the message to the source IMP (the IMP local\nto Host X). That IMP keeps a list (per local Host) of\ndestinations that are refusing messages from this source Host.\n\nThis restriction on messages might be removed by a destination Host\neither by sending a \"accept messages from Host X\" message to the\nIMP, or by resetting its Host/IMP interface.\n\nA Host might make use of such a facility by measuring, per source,\nthe number of undesired messages per unit time, if this measure\nexceeds a threshold then the Host could issue the \"refuse messages\nfrom Host X\" message to the IMP.\n"
};

/* =================================================================
   SESSION STATE
   ================================================================= */
let conn = false;       // a connection to SUMEX-AIM is open
let user = null;        // logged in as
let loginAt = 0;
let mode = "tip";       // tip | exec | bbd
const JOB = 17, TTY = 105;   // this terminal's job and (octal) line, as TENEX numbers them

/* =================================================================
   THE TIP  [2183]
   ================================================================= */
function tipCommand(rest){
  const words = rest.trim().toUpperCase().split(/\s+/).filter(Boolean);
  const w0 = words[0] || "";
  const arg = words[words.length-1];
  const c = w0[0] || "";
  if(c === "O" || c === "L"){                 // OPEN #, and LOGIN #, "an obsolete form of OPEN"
    const n = /^\d+$/.test(arg) && words.length > 1 ? parseInt(arg,10)
            : (/^[OL](\d+)$/.test(w0) ? parseInt(w0.slice(1),10) : NaN);
    if(isNaN(n)){ println("Num"); return afterTip(); }
    if(conn){ println("Can't"); return afterTip(); }
    openHost(n); return;
  }
  if(c === "C"){                              // CLOSE
    if(conn){ closeConn(); return; }
    println("Closed"); return afterTip();
  }
  if(c === "N"){                              // NETWORK-VIRTUAL-TIP-EXECUTIVE
    println("Wait"); pause(1800);
    println("Host not responding");
    return afterTip();
  }
  if(c === "H"){                              // HOST #
    if(!/^\d+$/.test(arg||"")){ println("Num"); return afterTip(); }
    return afterTip();
  }
  if("EDTSIRBFPGMX".includes(c) && c) return afterTip();   // parameters: set quietly
  println("BAD");
  return afterTip();
}
function afterTip(){ then(()=>{ if(conn) prompt(); }); }

function openHost(n){
  pause(500);
  println("Trying...");
  pause(1200);
  if(n === SUMEX){
    println("Open");
    println(HERALD);
    then(()=>{ conn = true; mode = "exec"; user = null; chipsFor(); });
    prompt();
    return;
  }
  println(HOSTS[n] ? "Refused" : "Host not responding");
  then(()=>{ chipsFor(); });
}
function closeConn(){
  println("Closed");
  then(()=>{ conn = false; mode = "tip"; user = null; chipsFor(); });
}

/* =================================================================
   TENEX EXEC  [EXEC], [SRC]
   ================================================================= */
function prompt(){ print("@"); }

function login(words){
  if(user){ println("YOU ARE ALREADY LOGGED IN"); return prompt(); }
  const name = (words[1] || "").toUpperCase();
  if(!name){ println(" ?"); return prompt(); }
  user = name; loginAt = Date.now();
  println(" JOB "+JOB+" ON TTY"+TTY+" "+date77()+" "+hhmm());
  then(()=>{ chipsFor(); });
  prompt();
}
function logout(){
  const secs = Math.max(4, Math.round((Date.now()-loginAt)/1000));
  const used = "0:0:"+Math.min(59, 1+Math.floor(secs/30));
  const inT = Math.floor(secs/3600)+":"+Math.floor((secs%3600)/60)+":"+(secs%60);
  const d = d77();
  println("KILLED JOB "+JOB+", USER "+user+", ACCT 1, TTY "+TTY+", AT "+(d.getMonth()+1)+"/"+d.getDate()+"/77 "+pad2(d.getHours())+pad2(d.getMinutes()));
  println("  USED "+used+" IN "+inT);
  pause(900);
  closeConn();
}

function execCommand(raw){
  const words = raw.trim().toUpperCase().split(/\s+/).filter(Boolean);
  const cmd = words[0] || "", arg = words[1];
  if(!cmd) return prompt();
  if(cmd === "LOGIN" || cmd === "LOG"){ login(words); return; }
  // before LOGIN, TENEX allows only a few commands [EXEC p.25]; the rest get " LOGIN PLEASE"
  if(!user && !["DAYTIME","WHERE","VERSION","SYSTAT","AVAILABLE"].includes(cmd)){ println(" LOGIN PLEASE"); return prompt(); }
  switch(cmd){
    case "DAYTIME": println(" "+daytime()); break;
    case "VERSION": println(HERALD); break;
    case "BBD":
      mode = "bbd"; print(BBD_BANNER); print("\n*"); chipsFor(); return;
    case "WHERE":
      if(user && arg === user) println(" TTY"+TTY+", JOB "+JOB+", NCC-TIP, EXEC");
      else println(" NOT LOGGED IN");
      break;
    case "TYPE":
      if(arg && FILES[arg]){ println(""); println(FILES[arg]); }
      else println(" ?");
      break;
    case "LOGOUT": case "LOGO":
      logout(); return;
    default:
      println(" ?");
  }
  prompt();
}

function bbdCommand(raw){
  const k = bbdKey(raw);
  if(["q","quit","exit"].includes(k)){ mode = "exec"; chipsFor(); prompt(); return; }
  const hit = Object.keys(BBD).find(c => bbdKey(c) === k);
  if(hit){ println(BBD[hit]); println(""); }
  print("*");
}

/* =================================================================
   INPUT WIRING
   ================================================================= */
function dispatch(raw){
  const t = raw.trim();
  // [2183] s.3: a TIP command "always starts with symbol @"; "@@" sends an @ through
  if(t.startsWith("@") && !t.startsWith("@@")){ tipCommand(t.slice(1)); return; }
  if(!conn) return;                           // nothing is listening yet
  const line = t.startsWith("@@") ? t.slice(1) : raw;
  if(mode === "bbd") bbdCommand(line); else execCommand(line);
}
function submit(){
  if(printing) return;
  const raw = kb.value;
  kb.value = "";
  type(raw);
}
function type(raw){
  queue.push({text: raw.toUpperCase() + "\n", cls:"usr"});
  then(()=>dispatch(raw));
}
sendBtn.addEventListener("click", ()=>{ submit(); kb.focus(); });
kb.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); }});
screen.addEventListener("click", ()=>{ if(!window.getSelection || String(window.getSelection()) === "") kb.focus({preventScroll:true}); });

/* command buttons, and the one modern line under the glass: how to drive it */
const chipsEl = document.getElementById("chips");
const noteEl  = document.getElementById("hint");
function setChips(defs, note){
  chipsEl.innerHTML = "";
  defs.forEach(([label,fn])=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.addEventListener("click", fn);
    chipsEl.appendChild(b);
  });
  noteEl.textContent = note || "";
}
function cmdChip(cmd, label){ return [label || cmd, ()=>{ if(!printing) type(cmd); }]; }
function chipsFor(){
  if(!conn)
    return setChips([cmdChip("@O 56", "@O 56  SUMEX-AIM")],
      "A terminal on BBN's NCC-TIP, Friday 21 January 1977. @O 56 opens a connection to SUMEX-AIM, the TENEX at Stanford.");
  if(!user)
    return setChips([cmdChip("LOGIN GUEST"), cmdChip("DAYTIME"), cmdChip("@C")],
      "SUMEX-AIM is asking you to log in. @C closes the connection.");
  if(mode === "bbd")
    return setChips(Object.keys(BBD).map(c => cmdChip(c.toUpperCase())).concat([cmdChip("Q")]),
      "SUMEX's bulletin board. These are the commands recorded on it that day; Q goes back to the Exec.");
  return setChips([cmdChip("BBD"), cmdChip("TYPE RFC439.TXT"), cmdChip("TYPE RFC527.TXT"), cmdChip("TYPE RFC706.TXT"),
                   cmdChip("TYPE RFC608.TXT"), cmdChip("DAYTIME"), cmdChip("VERSION"), cmdChip("WHERE "+user), cmdChip("LOGOUT")],
    "BBD is SUMEX's bulletin board. TYPE prints a file: here, four RFCs as they were published. LOGOUT ends the job.");
}

/* console switches */
document.getElementById("sndBtn").addEventListener("click", function(){
  soundOn = !soundOn;
  if(soundOn) initAudio();
  this.textContent = "SOUND " + (soundOn ? "ON" : "OFF");
  this.setAttribute("aria-pressed", soundOn);
  if(soundOn) dingBell();
});
document.getElementById("spdBtn").addEventListener("click", function(){
  // a dial-up 1200-baud modem; the commoner 300; a hardwired 9600 line
  if(cps === 120){ cps = 30; this.textContent = "300 BAUD"; }
  else if(cps === 30){ cps = 960; this.textContent = "9600 BAUD"; }
  else { cps = 120; this.textContent = "1200 BAUD"; }
  this.setAttribute("aria-pressed", cps !== 120);
});
document.getElementById("advBtn").addEventListener("click", flush);
document.getElementById("hangBtn").addEventListener("click", ()=>{ window.location.href = "../"; });

/* =================================================================
   THE CALL -- the hunt character, then a connection to SUMEX-AIM
   ================================================================= */
function intro(){
  setChips([], "");
  print("E","usr");                               // the hunt character [2183 s.4.A]
  println("");
  pause(700);
  type("@O 56");
}

intro();
})();
