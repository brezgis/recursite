<script>
// "jif" in the epigraph: each click drops a jar of Jif out of the word.
(function () {
  const word = document.querySelector(".jif");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function drop() {
    const r = word.getBoundingClientRect();
    const jar = new Image(); jar.src = "img/jif.png"; jar.alt = ""; jar.className = "jar";
    jar.style.left = (r.left + r.width / 2 - 45) + "px"; jar.style.top = (r.top - 20) + "px";
    document.body.append(jar);
    if (still) { jar.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], 1400).onfinish = () => jar.remove(); return; }
    const dx = (Math.random() - .5) * 320, spin = (Math.random() < .5 ? -1 : 1) * (240 + Math.random() * 300);
    const fall = innerHeight - r.top + 160;
    jar.animate([
      { transform: "translate(0, 0) scale(.2) rotate(0deg)", easing: "cubic-bezier(.2,.7,.4,1)" },       // pops out of the word…
      { transform: `translate(${dx * .25}px, -70px) scale(1) rotate(${spin * .15}deg)`, easing: "cubic-bezier(.5,0,1,.6)" },
      { transform: `translate(${dx}px, ${fall}px) scale(1) rotate(${spin}deg)` }                          // …and falls off the page
    ], { duration: 1500 + fall * .6 }).onfinish = () => jar.remove();
  }
  word.addEventListener("click", drop);
  word.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); drop(); } });
})();
</script>
