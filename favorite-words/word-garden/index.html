<!DOCTYPE html>
<!-- recursite/favorite-words/word-garden/ — hand-built; shown inside favorite-words/ through a window block.
     To plant a word, add an entry to WORDS below. Each flower is grown from its word: the petals and
     leaves are the word written over and over along their outlines, and the word decides the shape. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-garden</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #eef5fb; }
  #garden { height: 100%; overflow-x: auto; overflow-y: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
  #garden.wide { cursor: grab; }
  #garden { scrollbar-width: none; }              /* still scrolls: wheel, trackpad, drag, swipe */
  #garden::-webkit-scrollbar { display: none; }
  #garden.panning { cursor: grabbing; }
  #garden svg { display: block; height: 100%; }
  svg text { font-family: "Times New Roman", Times, serif; }
  .flower { cursor: pointer; outline: none; }
  /* hovering a flower "selects" it, with Paint's dashed selection box */
  .flower .marquee { visibility: hidden; }
  .flower:hover .marquee, .flower:focus-visible .marquee, .flower.open .marquee { visibility: visible; }

  /* the dictionary card */
  #card { position: fixed; top: 12px; right: 12px; width: min(330px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
          overflow: auto; box-sizing: border-box; background: #fffdf2; color: #000; border: 1px solid #8a7a50;
          box-shadow: 3px 3px 0 rgba(0,0,0,.3); padding: 12px 16px 12px; font: 15px/1.4 "Times New Roman", Times, serif; display: none; }
  #card.show { display: block; }
  #card h2 { font-size: 1.55em; margin: 0; font-weight: bold; letter-spacing: .01em; }
  #card .pr { color: #444; margin: 0 0 .1em; }
  #card .pos { font-style: italic; margin: .15em 0 .2em; }
  #card ol { margin: .2em 0 .5em; padding-left: 1.3em; }
  #card ol.one { list-style: none; padding-left: 0; }
  #card li { margin: .15em 0; }
  #card .ex { font-style: italic; color: #333; }
  #card .ety { border-top: 1px dotted #8a7a50; padding-top: .45em; margin: .5em 0 .4em; font-size: .93em; }
  #card .ety b { font-variant: small-caps; font-weight: normal; letter-spacing: .04em; }
  #card a { color: #0000ee; font-size: .9em; } #card a:visited { color: #551a8b; } #card a:hover { background: #ffff88; }
  #card button { position: absolute; top: 6px; right: 6px; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff;
                 font: bold 11px/1 Arial, Helvetica, sans-serif; padding: 2px 5px; cursor: pointer; }
  #card button:active { border-color: #808080 #fff #fff #808080; }
</style>
</head>
<body>
<div id="garden"></div>
<div id="card" role="dialog" aria-live="polite"></div>

<script>
/* Headwords use Merriam-Webster–style syllable dots; pronunciations are American.
   Definitions are condensed from standard dictionaries; the link goes to Wiktionary. */
const WORDS = [
  { word: "parochial", head: "pa·ro·chi·al", ipa: "/pəˈroʊkiəl/", pos: "adjective",
    defs: ["Having a limited or narrow outlook or scope; provincial.",
           "Of or relating to a church parish."],
    ety: "Late Middle English, via Old French from ecclesiastical Latin <i>parochialis</i>, from <i>parochia</i> ‘parish’, from Greek <i>paroikia</i> ‘sojourning’, from <i>paroikos</i> ‘neighbor, sojourner’ (<i>para-</i> ‘beside’ + <i>oikos</i> ‘house’)." },
  { word: "lacuna", head: "la·cu·na", ipa: "/ləˈk(j)uːnə/", pos: "noun (plural lacunae or lacunas)",
    defs: ["An unfilled space or interval; a gap.",
           "A missing portion in a manuscript or text.",
           "<span class=\"ex\">anatomy</span> A small cavity or depression, as in bone."],
    ety: "Mid-17th century, from Latin <i>lacuna</i> ‘pool, pit, gap’, from <i>lacus</i> ‘lake’." },
  { word: "desiderata", head: "de·sid·er·a·ta", ipa: "/dɪˌzɪdəˈrɑːtə/", pos: "plural noun (singular desideratum)",
    defs: ["Things that are needed or wanted."],
    ety: "Mid-17th century, from Latin, neuter plural of <i>desideratus</i>, past participle of <i>desiderare</i> ‘to long for, desire’." },
  { word: "anathema", head: "anath·e·ma", ipa: "/əˈnæθəmə/", pos: "noun",
    defs: ["Something or someone that one vehemently dislikes.",
           "A formal curse by a pope or church council, excommunicating a person or denouncing a doctrine."],
    ety: "Early 16th century, from ecclesiastical Latin, ‘excommunicated person, excommunication’, from Greek <i>anathema</i> ‘thing dedicated’, later ‘thing devoted to evil, accursed thing’, from <i>anatithenai</i> ‘to set up’." },
  { word: "quixotic", head: "quix·ot·ic", ipa: "/kwɪkˈsɑːtɪk/", pos: "adjective",
    defs: ["Exceedingly idealistic; unrealistic and impractical."],
    ety: "Late 18th century, from Don Quixote, the hero of Cervantes’s romance (1605–15), who set out to revive chivalry." },
  { word: "autopoiesis", head: "au·to·poi·e·sis", ipa: "/ˌɔːtoʊpɔɪˈiːsɪs/", pos: "noun",
    defs: ["The property of a living system, such as a cell, of producing and maintaining itself: continually remaking its own components and the boundary that holds them."],
    ety: "Coined in 1972 by the Chilean biologists Humberto Maturana and Francisco Varela, from Greek <i>auto-</i> ‘self’ + <i>poiēsis</i> ‘making, creation’." },
  { word: "apotheosis", head: "apoth·e·o·sis", ipa: "/əˌpɑːθiˈoʊsɪs/", pos: "noun (plural apotheoses)",
    defs: ["The highest point in the development of something; a culmination or climax.",
           "The elevation of someone to divine status; deification."],
    ety: "Late 16th century, via ecclesiastical Latin from Greek <i>apotheōsis</i>, from <i>apotheoun</i> ‘to make a god of’ (<i>apo-</i> + <i>theos</i> ‘god’)." },
  { word: "chiasmus", head: "chi·as·mus", ipa: "/kaɪˈæzməs/", pos: "noun",
    defs: ["A figure of speech in which words, grammatical constructions, or ideas are repeated in reverse order: <span class=\"ex\">“Ask not what your country can do for you — ask what you can do for your country.”</span>"],
    ety: "Mid-17th century, modern Latin, from Greek <i>khiasmos</i> ‘crosswise arrangement’, from <i>khiazein</i> ‘to mark with the letter chi (χ)’." },
  { word: "iconoclasm", head: "icon·o·clasm", ipa: "/aɪˈkɑːnəˌklæzəm/", pos: "noun",
    defs: ["The attacking or rejecting of cherished beliefs, institutions, or established values.",
           "The rejection or destruction of religious images as heretical, as in the Byzantine controversies of the 8th and 9th centuries."],
    ety: "Late 18th century, from <i>iconoclast</i>, via medieval Latin from ecclesiastical Greek <i>eikonoklastēs</i>, from <i>eikōn</i> ‘likeness, image’ + <i>klan</i> ‘to break’." },
  { word: "gestalt", head: "ge·stalt", ipa: "/ɡəˈʃtɑːlt/", pos: "noun (plural gestalten or gestalts)",
    defs: ["An organized whole that is perceived as more than the sum of its parts."],
    ety: "1920s, from German <i>Gestalt</i>, literally ‘form, shape’; taken into English through Gestalt psychology." },
  { word: "apocryphal", head: "apoc·ry·phal", ipa: "/əˈpɑːkrəfəl/", pos: "adjective",
    defs: ["Of doubtful authenticity, though widely circulated as true.",
           "Of or belonging to the Apocrypha."],
    ety: "Late 16th century, from <i>Apocrypha</i>, from ecclesiastical Latin <i>apocrypha (scripta)</i> ‘hidden (writings)’, from Greek <i>apokruphos</i>, from <i>apokruptein</i> ‘to hide away’." },
];

const NS = "http://www.w3.org/2000/svg";
const H = 440, GROUND = 392, GAP = 175, PAD = 115;
const W = PAD * 2 + GAP * (WORDS.length - 1);
/* MS Paint (Windows 95) default palette */
const PETALS = ["#FF0000", "#0000FF", "#FF00FF", "#800080", "#FF8040", "#000080", "#FF0080", "#8000FF"];
const LEAF = "#008000", STEM = "#008000";

/* a small seeded random, so each word always grows into the same flower */
function rng(word) {
  let h = 2166136261;
  for (const c of word) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
let uid = 0;
/* write `word` over and over around the outline `d`, stretched to exactly fill it */
function wordAlong(parent, d, word, size, color) {
  const id = "p" + (uid++);
  const path = el("path", { id, d, fill: "none" }, parent);
  const t = el("text", { "font-size": size, fill: color }, parent);
  const tp = el("textPath", { href: "#" + id }, t);
  tp.textContent = word + " ";
  const unit = t.getComputedTextLength() || size * .5 * (word.length + 1);
  const len = path.getTotalLength();
  const reps = Math.max(1, Math.floor(len / unit));
  tp.textContent = (word + " ").repeat(reps).trimEnd();
  tp.setAttribute("textLength", len - size * .3);
  tp.setAttribute("lengthAdjust", "spacing");
}
/* a leaf outline from (r0, 0) out to (r, 0) and back, w wide; rev runs it the other way round (used for leaves) */
function petalPath(r, w, rev, r0 = 0) {
  const a = r0 + (r - r0) * .25, b = r0 + (r - r0) * .85, s = rev ? -1 : 1;
  return `M${r0},0 C${a},${-w * s} ${b},${-w * .75 * s} ${r},0 C${b},${w * .75 * s} ${a},${w * s} ${r0},0`;
}

function grow(svg, entry, i) {
  const rand = rng(entry.word), n = entry.word.length;
  const x = PAD + i * GAP + (rand() - .5) * 40;
  const top = GROUND - (165 + rand() * 135);             // where the head sits
  const lean = (rand() - .5) * 46, bend = (rand() - .5) * 60;
  const color = PETALS[i % PETALS.length];

  const g = el("g", { class: "flower", tabindex: 0, role: "button", "aria-label": entry.word + " — show dictionary entry" }, svg);
  g.dataset.i = i;

  // the stem: a few straight strokes of the line tool, following a gentle curve
  const hx = x + lean, cx = x + bend, cy = (GROUND + top) / 2;
  const at = t => [(1 - t) ** 2 * x + 2 * (1 - t) * t * cx + t * t * hx, (1 - t) ** 2 * GROUND + 2 * (1 - t) * t * cy + t * t * top];
  const pts = [0, .3, .62, 1].map((t, k) => { const [px, py] = at(t); return [Math.round(px + (k % 3 ? (rand() - .5) * 6 : 0)), Math.round(py)]; });
  el("polyline", { points: pts.join(" "), fill: "none", stroke: STEM, "stroke-width": 2 }, g);

  // leaves: the word again in green, written straight out from the stem
  const nLeaves = 1 + (rand() < .6 ? 1 : 0), side0 = rand() < .5 ? -1 : 1;
  for (let k = 0; k < nLeaves; k++) {
    const side = k ? -side0 : side0, [lx, ly] = at(.22 + k * .2 + rand() * .1);
    const ang = side < 0 ? 30 + rand() * 20 : -30 - rand() * 20;     // left leaves run leftwards, still reading upright
    const leaf = el("g", { transform: `translate(${lx.toFixed(0)},${ly.toFixed(0)}) rotate(${ang.toFixed(0)})` }, g);
    const t = el("text", { x: side < 0 ? -3 : 3, "text-anchor": side < 0 ? "end" : "start", "font-size": 11, fill: LEAF, "dominant-baseline": "central" }, leaf);
    t.textContent = entry.word;
  }

  // the head: 4–6 spokes, each the word written straight out from the middle; long words get fewer
  const inner = el("g", { transform: `translate(${Math.round(hx)},${Math.round(top)})` }, g);
  const P = Math.max(4, Math.min(6, Math.round(8.5 - n * .4 + (rand() - .5))));
  const spin = rand() * 360, core = Math.round(5 + n * .3), size = 13;
  // chiasmus: every other spoke reads inward instead of outward, so the word crosses itself (ABBA)
  const cross = entry.word === "chiasmus";
  let R = 0;
  for (let p = 0; p < P; p++) {
    const inward = cross && p % 2;
    const pg = el("g", { transform: `rotate(${(spin + p * 360 / P + (inward ? 180 : 0)).toFixed(1)})` }, inner);
    const t = el("text", { "font-size": size, fill: color, "dominant-baseline": "central",
                           x: inward ? -(core + 4) : core + 4, "text-anchor": inward ? "end" : "start" }, pg);
    t.textContent = entry.word;
    R = Math.max(R, core + 4 + t.getComputedTextLength());
  }
  el("circle", { r: core, fill: "#FFFF00", stroke: "#000", "stroke-width": 1 }, inner);
  const bb = inner.getBBox();
  el("rect", { class: "marquee", x: Math.floor(bb.x) - 4, y: Math.floor(bb.y) - 4, width: Math.ceil(bb.width) + 8, height: Math.ceil(bb.height) + 8,
               fill: "none", stroke: "#000", "stroke-width": 1, "stroke-dasharray": "4 4" }, inner);
  // a wide invisible target, so the flower is easy to click
  g.insertBefore(el("circle", { r: R, cx: hx, cy: top, fill: "transparent" }), g.firstChild);
}

function draw() {
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, xmlns: NS, role: "img", "aria-label": "a garden of words" });
  document.getElementById("garden").appendChild(svg);
  // no anti-aliasing: every edge is either fully painted or not, like Paint's pencil and text tools
  const f = el("filter", { id: "pencil", x: 0, y: 0, width: "100%", height: "100%", "color-interpolation-filters": "sRGB" }, el("defs", {}, svg));
  el("feFuncA", { type: "discrete", tableValues: "0 1" }, el("feComponentTransfer", {}, f));
  el("rect", { width: W, height: H, fill: "#80FFFF" }, svg);                       // the sky, bucket-filled
  const fg = el("g", { filter: "url(#pencil)" }, svg);
  const r = rng("paint");
  // the sun, with rays from the line tool
  let rays = "";
  for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6 + .2; rays += `M${56 + Math.cos(a) * 30},${50 + Math.sin(a) * 30} L${56 + Math.cos(a) * (42 + r() * 8)},${50 + Math.sin(a) * (42 + r() * 8)} `; }
  el("path", { d: rays, stroke: "#000", "stroke-width": 1, fill: "none" }, fg);
  el("circle", { cx: 56, cy: 50, r: 24, fill: "#FFFF00", stroke: "#000", "stroke-width": 1 }, fg);
  // clouds: scalloped outlines, filled white
  for (const [cx, cy] of [[330, 46], [980, 34], [1560, 52]]) {
    el("path", { d: `M${cx},${cy} a13,13 0 0 1 16,-15 a17,17 0 0 1 31,-6 a15,15 0 0 1 27,4 a12,12 0 0 1 6,17 Z`,
                 fill: "#FFFFFF", stroke: "#000", "stroke-width": 1 }, fg);
  }
  // the ground: dirt, and grass with a zig-zag pencil edge
  el("rect", { y: GROUND + 16, width: W, height: H, fill: "#804000" }, fg);
  let d = `M0,${GROUND + 17} L0,${GROUND}`;
  for (let xx = 0; xx <= W; xx += 5 + Math.round(r() * 5)) d += ` L${xx},${GROUND - 2 - Math.round(r() * 9)} L${xx + 3},${GROUND + 2}`;
  el("path", { d: d + ` L${W},${GROUND + 17} Z`, fill: "#00C000", stroke: "#008000", "stroke-width": 1 }, fg);

  WORDS.forEach((w, i) => grow(fg, w, i));
  size();
  return svg;
}
function size() {
  const svg = document.querySelector("#garden svg");
  const g = document.getElementById("garden");
  svg.style.width = Math.max(g.clientHeight * W / H, 1) + "px";
  g.classList.toggle("wide", g.scrollWidth > g.clientWidth + 1);
}

/* ---- the dictionary card ---- */
const card = document.getElementById("card");
let openFlower = null;
function show(g) {
  const e = WORDS[+g.dataset.i];
  if (openFlower) openFlower.classList.remove("open");
  openFlower = g; g.classList.add("open");
  const defs = e.defs.map(x => `<li>${x}</li>`).join("");
  card.innerHTML = `<button type="button" aria-label="close">X</button>
    <h2>${e.head}</h2><p class="pr">${e.ipa}</p><p class="pos">${e.pos}</p>
    <ol${e.defs.length === 1 ? ' class="one"' : ""}>${defs}</ol>
    <p class="ety"><b>origin</b> ${e.ety}</p>
    <a href="https://en.wiktionary.org/wiki/${encodeURIComponent(e.word)}" target="_blank" rel="noopener">${e.word} on Wiktionary &rarr;</a>`;
  card.classList.add("show");
  card.querySelector("button").onclick = hide;
}
function hide() {
  card.classList.remove("show");
  if (openFlower) { openFlower.classList.remove("open"); openFlower.focus({ preventScroll: true }); openFlower = null; }
}

/* ---- wandering: wheel scrolls sideways, and the mouse can drag the garden ---- */
const garden = document.getElementById("garden");
garden.addEventListener("wheel", e => {
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  const max = garden.scrollWidth - garden.clientWidth;
  if ((e.deltaY < 0 && garden.scrollLeft <= 0) || (e.deltaY > 0 && garden.scrollLeft >= max)) return;   // let the page scroll
  garden.scrollLeft += e.deltaY; e.preventDefault();
}, { passive: false });
let pan = null, dragged = false;
garden.addEventListener("pointerdown", e => {
  dragged = false;
  if (e.pointerType !== "mouse" || e.button || !garden.classList.contains("wide")) return;
  pan = { x: e.clientX, left: garden.scrollLeft };
});
addEventListener("pointermove", e => {
  if (!pan) return;
  const dx = e.clientX - pan.x;
  if (Math.abs(dx) > 4) { dragged = true; garden.classList.add("panning"); }
  if (dragged) garden.scrollLeft = pan.left - dx;
});
addEventListener("pointerup", () => { pan = null; garden.classList.remove("panning"); });
garden.addEventListener("click", e => {
  if (dragged) return;
  const g = e.target.closest(".flower");
  if (g) show(g); else hide();
});
garden.addEventListener("keydown", e => {
  const g = e.target.closest && e.target.closest(".flower");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(g); }
});
addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
addEventListener("resize", size);

draw();
</script>
</body>
</html>
